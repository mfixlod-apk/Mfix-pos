name: Extract Android Source

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          set -euo pipefail
          rm -rf extracted-source extracted-project
          mkdir extracted-source extracted-project
          unzip -q MFIX_Android_GitHub.zip -d extracted-source
          PROJECT_DIR="$(find extracted-source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. extracted-project/
          rm -rf extracted-source

          # Preserve repository workflows and project source separately.
          mkdir -p extracted-project/.github
          if [ -d .github ]; then
            cp -a .github/. extracted-project/.github/
          fi
          mv extracted-project/. extracted-source/
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name extracted-source -exec rm -rf {} +
          cp -a extracted-source/. .
          rm -rf extracted-source

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract Android source from project archive"
          git push
