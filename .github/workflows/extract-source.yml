name: Extract Android Source

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mfix-source
          mkdir -p /tmp/mfix-source
          unzip -q MFIX_Android_GitHub.zip -d /tmp/mfix-source
          PROJECT_DIR="$(find /tmp/mfix-source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "Project found: $PROJECT_DIR"

          mkdir -p /tmp/mfix-project
          cp -a "$PROJECT_DIR"/. /tmp/mfix-project/
          # Remove archived workflows: GitHub Actions token cannot push workflow files from inside this run.
          rm -rf /tmp/mfix-project/.github

          # Remove extracted project files from repo, but keep git metadata.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mfix-project/. .

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract Android source from project archive"
            git push
          fi
