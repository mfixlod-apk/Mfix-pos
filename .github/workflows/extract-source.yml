name: Extract Android Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          set -e
          rm -rf extracted-source
          mkdir extracted-source
          unzip -q MFIX_Android_GitHub.zip -d extracted-source
          PROJECT_DIR="$(find extracted-source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          shopt -s dotglob
          mv "$PROJECT_DIR"/* .
          rm -rf extracted-source

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract Android source from project archive"
          git push
