name: CI Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify MFIX source invariants
        run: python3 scripts/verify_source_invariants.py
      - name: Verify embedded JavaScript syntax
        run: python3 scripts/verify_javascript_syntax.py
