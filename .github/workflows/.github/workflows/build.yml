name: Build MFIX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract MFIX project
        run: |
          unzip -o MFIX_Android_GitHub.zip -d extracted
          test -f extracted/MFIX_Android_GitHub/settings.gradle
          test -f extracted/MFIX_Android_GitHub/build.gradle
          test -f extracted/MFIX_Android_GitHub/app/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        working-directory: extracted/MFIX_Android_GitHub
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MFIX-APK
          path: extracted/MFIX_Android_GitHub/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
