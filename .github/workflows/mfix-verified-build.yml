name: MFIX Verified Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-build-and-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply inventory source migration directly
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* MFIX INVENTORY STOCK POLICY v2 */'
          if marker not in s:
              s = s.replace(
                  "const MISC_PARTS = ['returns','shifts','giftCards','preorders','auditLog'];",
                  "const MISC_PARTS = ['returns','shifts','giftCards','preorders','auditLog','inventoryHistory'];"
              )
              s = s.replace(
                  "function miscBundle(){\n  return {returns:STATE.returns, shifts:STATE.shifts, giftCards:STATE.giftCards, preorders:STATE.preorders, auditLog:STATE.auditLog};\n}",
                  "function miscBundle(){\n  return {returns:STATE.returns, shifts:STATE.shifts, giftCards:STATE.giftCards, preorders:STATE.preorders, auditLog:STATE.auditLog, inventoryHistory:STATE.inventoryHistory||[]};\n}"
              )
              s = s.replace(
                  "  STATE.auditLog = (misc && misc.auditLog) || [];\n  STATE.currentShift",
                  "  STATE.auditLog = (misc && misc.auditLog) || [];\n  STATE.inventoryHistory = (misc && Array.isArray(misc.inventoryHistory)) ? misc.inventoryHistory : [];\n  STATE.currentShift"
              )
              addon = r'''
/* MFIX INVENTORY STOCK POLICY v2 */
// Ordinary product stock is informational: sales remain allowed at zero/negative stock.
// Serial/IMEI availability remains a separate control.
(function(){
  const originalAdd = window.addToCart;
  if (typeof originalAdd === 'function') {
    window.addToCart = function(product, qty){
      if (!product) return;
      qty = Math.max(1, Number(qty) || 1);
      const existing = (STATE.cart || []).find(l => l.productId === product.id && !l.imeiRowId);
      if (existing) existing.qty = Number(existing.qty || 0) + qty;
      else STATE.cart.push({lineId:uid('ln'), productId:product.id, name:product.name, qty, unitPrice:product.price, isGift:false});
      if (typeof renderCart === 'function') renderCart();
      if (typeof clearPosSearch === 'function') clearPosSearch();
    };
  }
  const originalQty = window.changeCartQty;
  if (typeof originalQty === 'function') {
    window.changeCartQty = function(lineId, delta){
      const line = (STATE.cart || []).find(l => l.lineId === lineId); if (!line) return;
      if (line.imeiRowId) { if (typeof toast === 'function') toast('מוצר עם סריאל — כמות תמיד 1.'); return; }
      line.qty = Math.max(1, Number(line.qty || 1) + Number(delta || 0));
      if (typeof renderCart === 'function') renderCart();
    };
  }
  const originalFinalize = window.finalizeSale;
  if (typeof originalFinalize === 'function') {
    window.finalizeSale = async function(){
      const changed = [];
      for (const line of (STATE.cart || [])) {
        const p = typeof getProduct === 'function' ? getProduct(line.productId) : null;
        if (p && !p.trackSerial && !p.isPart && Number(p.stock || 0) < Number(line.qty || 0)) {
          changed.push({p, stock:Number(p.stock || 0)}); p.stock = 1000000000;
        }
      }
      const before = (STATE.sales || []).length;
      try { return await originalFinalize.apply(this, arguments); }
      finally {
        const completed = (STATE.sales || []).length > before;
        if (changed.length) {
          const last = completed ? STATE.sales[STATE.sales.length - 1] : null;
          changed.forEach(x => {
            const sold = last ? (last.items || []).filter(i => i.productId === x.p.id).reduce((n,i) => n + Number(i.qty || 0), 0) : 0;
            x.p.stock = completed ? x.stock - sold : x.stock;
          });
          if (completed && typeof persist === 'function') await persist('products');
        }
      }
    };
  }
})();
'''
              head, tail = s.rsplit('</script>', 1)
              s = head + '\n' + addon + '\n</script>' + tail
              p.write_text(s, encoding='utf-8')
          if marker not in p.read_text(encoding='utf-8'):
              raise SystemExit('inventory migration marker missing')
          PY

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I|re.S)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/mfix.js').write_text(max(scripts,key=len), encoding='utf-8')
          PY
          node --check /tmp/mfix.js

      - name: Commit migrated application source
        run: |
          if ! git diff --quiet -- app/src/main/assets/index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/assets/index.html
            git commit -m 'fix: persist inventory history and allow ordinary sales without stock'
            git push origin HEAD:main
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MFIX-POS-debug-APK-verified
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
