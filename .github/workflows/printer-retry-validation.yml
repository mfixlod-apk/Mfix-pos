name: MFIX Printer Retry Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with printer retry queue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject printer retry queue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          html=p.read_text(encoding='utf-8')
          marker='<script src="printer-retry-queue.js"></script>'
          if marker not in html:
              html=html.replace('</body>', marker+'\n</body>', 1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Validate printer retry module
        run: |
          test -s app/src/main/assets/printer-retry-queue.js
          node --check app/src/main/assets/printer-retry-queue.js
          grep -Fq 'printer-retry-queue.js' app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -p "$APK" assets/index.html > /tmp/index.html
          unzip -p "$APK" assets/printer-retry-queue.js > /tmp/printer-retry-queue.js
          test -s /tmp/index.html
          test -s /tmp/printer-retry-queue.js
          node --check /tmp/printer-retry-queue.js
          grep -Fq 'printer-retry-queue.js' /tmp/index.html

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MFIX-printer-retry-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
