name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build MFIX Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject inventory enhancements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html_path=Path('app/src/main/assets/index.html')
          html=html_path.read_text(encoding='utf-8')
          for name in ('inventory-history-export.js','inventory-low-stock-filter.js'):
              marker=f'<script src="{name}"></script>'
              if marker not in html:
                  html=html.replace('</body>', marker+'\n</body>', 1)
          html_path.write_text(html,encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Validate embedded app
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/printer-manager.js
          test -s app/src/main/assets/inventory-history-export.js
          test -s app/src/main/assets/inventory-low-stock-filter.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I|re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/mfix.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/mfix.js
          node --check app/src/main/assets/printer-manager.js
          node --check app/src/main/assets/inventory-history-export.js
          node --check app/src/main/assets/inventory-low-stock-filter.js
          python3 scripts/verify_release_invariants.py

      - name: Build Release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -p "$APK" assets/index.html > /tmp/index.html
          test -s /tmp/index.html
          for name in inventory-history-export.js inventory-low-stock-filter.js; do
            unzip -p "$APK" "assets/$name" > "/tmp/$name"
            test -s "/tmp/$name"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('/tmp/index.html').read_text(encoding='utf-8')
          for name in ('inventory-history-export.js','inventory-low-stock-filter.js'):
              if name not in html:
                  raise SystemExit(f'{name} was not packaged')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I|re.S)
          if not scripts:
              raise SystemExit('Packaged index.html has no inline script')
          Path('/tmp/packaged-mfix.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/packaged-mfix.js
          node --check /tmp/inventory-history-export.js
          node --check /tmp/inventory-low-stock-filter.js
          unzip -p "$APK" assets/content.js > /tmp/content.js
          test -s /tmp/content.js

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MFIX-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
