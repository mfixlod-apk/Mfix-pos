name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build MFIX Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject MFIX enhancements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html_path=Path('app/src/main/assets/index.html')
          html=html_path.read_text(encoding='utf-8')
          for name in ('printer-manager.js','inventory-history-export.js','inventory-low-stock-filter.js','inventory-serial-imei-export.js','inventory-serial-imei-viewer.js','inventory-product-editor.js','inventory-history-viewer.js','checkout-cart-line-controls.js','settings-printer-summary.js','printer-auto-print.js','printer-diagnostics.js','reports-date-range-fix.js','yesh-invoice-health-check.js','payment-safety-guard.js'):
              marker=f'<script src="{name}"></script>'
              if marker not in html:
                  html=html.replace('</body>', marker+'\n</body>', 1)
          html_path.write_text(html,encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Validate embedded app
        run: |
          test -s app/src/main/assets/index.html
          for name in printer-manager.js inventory-history-export.js inventory-low-stock-filter.js inventory-serial-imei-export.js inventory-serial-imei-viewer.js inventory-product-editor.js inventory-history-viewer.js checkout-cart-line-controls.js settings-printer-summary.js printer-auto-print.js printer-diagnostics.js reports-date-range-fix.js yesh-invoice-health-check.js payment-safety-guard.js; do
            test -s "app/src/main/assets/$name"
            node --check "app/src/main/assets/$name"
          done
          grep -Fq 'printer-manager.js' app/src/main/assets/index.html
          grep -Fq 'inventory-history-export.js' app/src/main/assets/index.html
          grep -Fq 'inventory-low-stock-filter.js' app/src/main/assets/index.html
          grep -Fq 'inventory-serial-imei-export.js' app/src/main/assets/index.html
          grep -Fq 'inventory-serial-imei-viewer.js' app/src/main/assets/index.html
          grep -Fq 'inventory-product-editor.js' app/src/main/assets/index.html
          grep -Fq 'inventory-history-viewer.js' app/src/main/assets/index.html
          grep -Fq 'checkout-cart-line-controls.js' app/src/main/assets/index.html
          grep -Fq 'settings-printer-summary.js' app/src/main/assets/index.html
          grep -Fq 'printer-auto-print.js' app/src/main/assets/index.html
          grep -Fq 'printer-diagnostics.js' app/src/main/assets/index.html
          grep -Fq 'reports-date-range-fix.js' app/src/main/assets/index.html
          grep -Fq 'yesh-invoice-health-check.js' app/src/main/assets/index.html
          grep -Fq 'payment-safety-guard.js' app/src/main/assets/index.html
          python3 scripts/verify_release_invariants.py

      - name: Build Release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -p "$APK" assets/index.html > /tmp/index.html
          test -s /tmp/index.html
          for name in printer-manager.js inventory-history-export.js inventory-low-stock-filter.js inventory-serial-imei-export.js inventory-serial-imei-viewer.js inventory-product-editor.js inventory-history-viewer.js checkout-cart-line-controls.js settings-printer-summary.js printer-auto-print.js printer-diagnostics.js reports-date-range-fix.js yesh-invoice-health-check.js payment-safety-guard.js; do
            unzip -p "$APK" "assets/$name" > "/tmp/$name"
            test -s "/tmp/$name"
            node --check "/tmp/$name"
            grep -Fq "$name" /tmp/index.html
          done
          unzip -p "$APK" assets/content.js > /tmp/content.js
          test -s /tmp/content.js

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MFIX-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
