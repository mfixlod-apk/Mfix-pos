name: Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    name: Verify and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Repair known legacy JavaScript quote bug
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          lines=s.splitlines(True)
          changed=False
          for i,line in enumerate(lines):
              if "resumeParkedSale(" in line and "deleteParkedSale(" in line and "return '<tr>" in line:
                  nl="    return '<tr><td>'+fmtDate(p.createdAt)+'</td><td>'+esc(p.note||'—')+'</td><td>'+(p.cart||[]).reduce((s,l)=>s+(Number(l.qty)||1),0)+'</td><td><b>'+money(Math.max(0,total))+'</b></td><td><button class=\"btn btn-primary\" onclick=\"resumeParkedSale('+JSON.stringify(p.id)+')\">המשך</button> <button class=\"btn btn-red\" onclick=\"deleteParkedSale('+JSON.stringify(p.id)+')\">מחק</button></td></tr>';\n"
                  if line != nl:
                      lines[i]=nl
                      changed=True
          if not changed:
              print('No known parked-sale quote bug found')
          else:
              p.write_text(''.join(lines),encoding='utf-8')
              print('Repaired parked-sale JavaScript quote bug')
          PY
          if ! git diff --quiet -- app/src/main/assets/index.html; then
            git config user.name "MFIX POS CI"
            git config user.email "mfixlod@gmail.com"
            git add app/src/main/assets/index.html
            git commit -m "Fix parked sale action quoting that caused blank WebView"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Show toolchain versions
        run: |
          java -version
          gradle --version
          sdkmanager --list | head -n 80

      - name: Validate embedded MFIX web app syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          # The POS generates printable HTML inside JavaScript template strings,
          # so nested literal <script> tags may appear in the source. Extract the
          # outer application script from the first opening tag to the final closing tag.
          start=html.find('<script>')
          end=html.rfind('</script>')
          if start < 0 or end < start:
              raise SystemExit('Main MFIX application script was not found')
          script=html[start+len('<script>'):end]
          Path('/tmp/mfix-pos.js').write_text(script, encoding='utf-8')
          print('Extracted MFIX JavaScript:', len(script), 'bytes')
          PY
          node --check /tmp/mfix-pos.js

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Verify debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MFIX-POS-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
