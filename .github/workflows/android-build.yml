name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate embedded app
        run: |
          test -s app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I|re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/mfix.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/mfix.js

      - name: Build Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MFIX-POS-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
