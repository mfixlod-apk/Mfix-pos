plugins { id 'com.android.application' }

android {
    namespace 'com.mfix.pos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mfix.pos'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

def generatedMfixAssets = layout.buildDirectory.dir('generated/mfix-assets')

tasks.register('prepareMfixAssets') {
    inputs.dir('src/main/assets')
    outputs.dir(generatedMfixAssets)
    doLast {
        def outDir = generatedMfixAssets.get().asFile
        delete(outDir)
        copy {
            from('src/main/assets')
            into(outDir)
        }

        def partsDir = new File(outDir, 'content_parts')
        def parts = partsDir.listFiles({ f -> f.name ==~ /\d{2}\.js/ } as FileFilter)
        if (!parts || parts.length != 19) {
            throw new GradleException("MFIX original content.js requires 19 parts; found " + (parts ? parts.length : 0))
        }
        parts.sort { a, b -> a.name <=> b.name }
        def originalContent = new StringBuilder()
        parts.each { f -> originalContent.append(f.getText('UTF-8')) }
        def contentFile = new File(outDir, 'content.js')
        contentFile.setText(originalContent.toString(), 'UTF-8')
        delete(partsDir)

        def moduleFiles = [
            'printer-manager.js',
            'printer-auto-print.js',
            'printer-diagnostics.js',
            'settings-printer-summary.js',
            'settings-general.js',
            'inventory-product-editor.js',
            'inventory-history-viewer.js',
            'inventory-history-export.js',
            'inventory-low-stock-filter.js',
            'inventory-serial-imei-viewer.js',
            'inventory-serial-imei-export.js',
            'checkout-cart-line-controls.js',
            'checkout-stock-guard.js',
            'payment-safety-guard.js',
            'payment-failure-signal.js',
            'reports-csv-export.js',
            'reports-date-range-fix.js',
            'reports-local-export.js',
            'users-permissions.js',
            'backup-restore-safety.js',
            'backup-restore-validator.js',
            'yesh-invoice-health-check.js'
        ]

        def index = new File(outDir, 'index.html')
        def html = index.getText('UTF-8')
        def close = html.lastIndexOf('</body>')
        if (close < 0) throw new GradleException('MFIX index.html is missing </body>')

        moduleFiles.each { fileName ->
            html = html.replace('<script src="' + fileName + '"></script>\n', '')
            html = html.replace('<script src="' + fileName + '"></script>', '')
        }

        def tags = moduleFiles.collect { '<script src="' + it + '"></script>' }.join('\n') + '\n'
        close = html.lastIndexOf('</body>')
        html = html.substring(0, close) + tags + html.substring(close)
        index.setText(html, 'UTF-8')

        moduleFiles.each { fileName ->
            def module = new File(outDir, fileName)
            if (!module.isFile() || module.length() == 0) {
                throw new GradleException('MFIX module is missing or empty: ' + fileName)
            }
        }
    }
}

android.sourceSets.main.assets.srcDirs = [generatedMfixAssets]
tasks.named('preBuild').configure { dependsOn('prepareMfixAssets') }
