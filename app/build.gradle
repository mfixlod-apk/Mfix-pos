plugins { id 'com.android.application' }

android {
    namespace 'com.mfix.pos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mfix.pos'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Keep the release artifact directly installable for this internal MFIX release.
            signingConfig signingConfigs.debug
        }
    }
}

// Compose the large single-file UI with optional native-backed modules at build time.
def generatedMfixAssets = layout.buildDirectory.dir('generated/mfix-assets')

tasks.register('prepareMfixAssets') {
    inputs.dir('src/main/assets')
    outputs.dir(generatedMfixAssets)
    doLast {
        def outDir = generatedMfixAssets.get().asFile
        delete(outDir)
        copy {
            from('src/main/assets')
            into(outDir)
        }

        // The original MFIX 16.9.19 content.js is stored in numbered chunks
        // because GitHub's text-content endpoint has payload limits. Reassemble
        // it byte-for-byte (UTF-8 text) before packaging the Android assets.
        def partsDir = new File(outDir, 'content_parts')
        def parts = partsDir.listFiles({ f -> f.name ==~ /\\d{2}\\.js/ } as FileFilter)
        if (!parts || parts.length != 19) {
            throw new GradleException("MFIX original content.js requires 19 parts; found " + (parts ? parts.length : 0))
        }
        parts.sort { a, b -> a.name <=> b.name }
        def originalContent = new StringBuilder()
        parts.each { f ->
            originalContent.append(f.getText('UTF-8'))
        }
        def contentFile = new File(outDir, 'content.js')
        contentFile.setText(originalContent.toString(), 'UTF-8')
        delete(partsDir)

        def index = new File(outDir, 'index.html')
        def html = index.getText('UTF-8')
        def marker = '<script src="printer-manager.js"></script>'
        if (!html.contains(marker)) {
            def close = html.lastIndexOf('</body>')
            if (close < 0) throw new GradleException('MFIX index.html is missing </body>')
            html = html.substring(0, close) + marker + '\n' + html.substring(close)
            index.setText(html, 'UTF-8')
        }
    }
}

android.sourceSets.main.assets.srcDirs = [generatedMfixAssets]
tasks.named('preBuild').configure { dependsOn('prepareMfixAssets') }
