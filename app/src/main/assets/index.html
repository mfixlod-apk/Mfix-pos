<html lang="he" dir="rtl">
<head>

<style>
:root{
  --navy-950:#0b1220;
  --navy-900:#111a2b;
  --navy-800:#182238;
  --navy-700:#233150;
  --blue-500:#2f6fed;
  --blue-600:#2158cf;
  --blue-100:#e8effe;
  --green-600:#16a34a;
  --green-100:#e7f8ee;
  --red-600:#dc2626;
  --red-100:#fdeaea;
  --amber-500:#f59e0b;
  --amber-100:#fef3e0;
  --purple-500:#7c4fe0;
  --gray-50:#f5f7fa;
  --gray-100:#eef1f6;
  --gray-200:#e2e7ef;
  --gray-300:#cbd3e1;
  --gray-500:#6b7686;
  --gray-700:#3c4657;
  --gray-900:#1b2331;
  --radius:10px;
  --radius-lg:16px;
  --shadow:0 2px 10px rgba(15,23,42,.08);
  --shadow-lg:0 12px 30px rgba(15,23,42,.16);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:"Segoe UI","Arial Hebrew","Tahoma",Arial,sans-serif;
  background:var(--gray-50);
  color:var(--gray-900);
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== APP SHELL ===== */
#app{display:flex;height:100vh;width:100vw;overflow:hidden;}

.sidebar{
  width:88px;
  background:linear-gradient(180deg,var(--navy-950),var(--navy-900));
  color:#cdd6e8;
  display:flex;flex-direction:column;align-items:center;
  padding:14px 0;flex-shrink:0;
  z-index:20;
}
.sidebar .brand{
  width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,var(--blue-500),var(--purple-500));
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:20px;color:#fff;margin-bottom:18px;
  box-shadow:var(--shadow-lg);
}
.navtabs{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center;flex:1;}
.navtab{
  width:70px;padding:10px 4px;border:none;background:transparent;color:#8ea0c2;
  display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:12px;
  font-size:11px;font-weight:600;transition:.15s;
}
.navtab .ic{font-size:20px;line-height:1;}
.navtab:hover{background:rgba(255,255,255,.06);color:#fff;}
.navtab.active{background:var(--blue-500);color:#fff;box-shadow:0 6px 16px rgba(47,111,237,.45);}
.sidebar .clock{margin-top:auto;font-size:11px;color:#5f6f8f;text-align:center;padding-top:10px;line-height:1.5;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.topbar{
  height:60px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--gray-200);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;
}
.topbar h1{font-size:18px;font-weight:800;margin:0;color:var(--navy-900);}
.topbar .sub{font-size:12px;color:var(--gray-500);font-weight:500;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.badge{
  padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700;
}
.badge.blue{background:var(--blue-100);color:var(--blue-600);}
.badge.green{background:var(--green-100);color:var(--green-600);}
.badge.amber{background:var(--amber-100);color:#946200;}

.view{flex:1;overflow:auto;padding:18px;display:none;}
.view.active{display:block;}

/* ===== GENERIC UI ===== */
.card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:16px;}
.btn{
  border:none;border-radius:var(--radius);padding:11px 16px;font-weight:700;font-size:14px;
  display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:.12s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--blue-500);color:#fff;}
.btn-primary:hover{background:var(--blue-600);}
.btn-green{background:var(--green-600);color:#fff;}
.btn-red{background:var(--red-600);color:#fff;}
.btn-amber{background:var(--amber-500);color:#fff;}
.btn-ghost{background:var(--gray-100);color:var(--gray-700);}
.btn-outline{background:#fff;border:1.5px solid var(--gray-300);color:var(--gray-700);}
.btn-lg{padding:16px 20px;font-size:16px;border-radius:14px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.input, select.input, textarea.input{
  width:100%;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:var(--radius);
  font-size:14px;background:#fff;color:var(--gray-900);
}
.input:focus, select.input:focus, textarea.input:focus{outline:none;border-color:var(--blue-500);}
label.flabel{font-size:12.5px;font-weight:700;color:var(--gray-700);margin-bottom:5px;display:block;}
.field{margin-bottom:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
table.tbl th{
  text-align:right;padding:10px 12px;background:var(--gray-50);color:var(--gray-500);
  font-size:11.5px;font-weight:700;text-transform:uppercase;border-bottom:1px solid var(--gray-200);
  position:sticky;top:0;
}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--gray-100);}
table.tbl tr:hover td{background:var(--gray-50);}

.pill{padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;display:inline-block;}
.pill.gray{background:var(--gray-100);color:var(--gray-700);}
.pill.green{background:var(--green-100);color:var(--green-600);}
.pill.amber{background:var(--amber-100);color:#946200;}
.pill.red{background:var(--red-100);color:var(--red-600);}
.pill.blue{background:var(--blue-100);color:var(--blue-600);}

.section-title{font-size:15px;font-weight:800;margin:0 0 12px;color:var(--navy-900);display:flex;align-items:center;gap:8px;}
.muted{color:var(--gray-500);}
.empty-state{padding:40px 20px;text-align:center;color:var(--gray-500);}
.empty-state .ic{font-size:38px;margin-bottom:8px;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(11,18,32,.55);display:none;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.modal-overlay.active{display:flex;}
.modal{
  background:#fff;border-radius:var(--radius-lg);width:100%;max-width:560px;max-height:90vh;overflow:auto;
  box-shadow:var(--shadow-lg);
}
.modal.wide{max-width:820px;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:16px;font-weight:800;}
.modal-close{background:none;border:none;font-size:20px;color:var(--gray-500);cursor:pointer;}
.modal-body{padding:18px 20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--gray-200);display:flex;gap:10px;justify-content:flex-end;}

.toast-wrap{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy-900);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:toastin .25s;}
.toast.err{background:var(--red-600);}
.toast.ok{background:var(--green-600);}
@keyframes toastin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

<body>

<script>
/* =====================================================================
   סלולר-פרו — מערכת קופה רושמת + CRM לחנות סלולר
   ARCHITECTURE: single-file app. State kept in memory (STATE), persisted
   via window.storage (per-user, personal scope). Everything renders
   through render() which redraws the active tab from STATE.
===================================================================== */

const STORAGE_KEYS = {
  settings:'cp_settings', products:'cp_products', customers:'cp_customers',
  sales:'cp_sales', repairs:'cp_repairs',
  misc:'cp_misc' // bundles: returns, shifts, giftCards, preorders, auditLog — saved together to cut down request volume
};
const MISC_PARTS = ['returns','shifts','giftCards','preorders','auditLog'];

let STATE = {
  activeTab:'pos',
  settings:null, products:[], customers:[], sales:[], repairs:[],
  returns:[], shifts:[], giftCards:[], preorders:[], auditLog:[],
  currentShift:null,
  currentRole:'manager', // 'manager' | 'cashier'
  cart:[], // {lineId, productId, name, qty, unitPrice, imei, serial, isGift, promoTag}
  cartCustomerId:null,
  linkedRepairId:null,
  docCustomerName:'',
  docCustomerPhone:'',
  pointsToRedeem:0,
  loaded:false,
  inventoryHistory:[] // {id,productId,type,qty,before,after,reason,at}
};


let MFIX_USB_CLAIMED_IFACE = null;

async function mfixReleaseUsbPrinterAfterPrint(){
  const device = (typeof MFIX_USB_PRINTER!=='undefined') ? MFIX_USB_PRINTER : null;
  if(!device) return;

  try{
    if(device.opened && MFIX_USB_CLAIMED_IFACE !== null){
      try{ await device.releaseInterface(MFIX_USB_CLAIMED_IFACE); }catch(_){}
    }
  }finally{
    try{
      if(device.opened) await device.close();
    }catch(_){}
    MFIX_USB_CLAIMED_IFACE = null;
    // Keep browser permission, but drop our live device handle.
    try{ MFIX_USB_PRINTER = null; }catch(_){}
  }
}

function uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function money(n){
  n = Number(n||0);
  return '₪' + n.toLocaleString('he-IL', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function todayISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('he-IL') + ' ' + d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
}
function addMonths(date, months){
  const d = new Date(date);
  d.setMonth(d.getMonth() + Number(months||0));
  return d;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg, kind){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
}

function openModal(html, opts){
  const ov = document.getElementById('modalOverlay');
  ov.innerHTML = `<div class="modal ${opts&&opts.wide?'wide':''}">${html}</div>`;
  ov.classList.add('active');
  ov.onclick = (e)=>{ if(e.target===ov) closeModal(); };
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('modalOverlay').innerHTML='';
}

/* ---------------- persistence ---------------- */
async function saveKey(key, value, opts){
  const silent = opts && opts.silent;
  const payload = JSON.stringify(value);
  try{
    // If the special storage API exists, keep using it.
    if(window.storage && typeof window.storage.set === 'function'){
      const r = await window.storage.set(key, payload, false);
      if(r) return r;
    }

    // Normal HTML/Chrome/Chromebook fallback: persistent browser storage.
    localStorage.setItem(key, payload);
    return true;
  }catch(e){
    console.error('[MFIX SAVE]', key, e);
    if(!silent) toast('שגיאה בשמירת נתונים ('+key+')','err');
    return null;
  }
}
async function loadKey(key){
  try{
    // First try the special storage API when available.
    if(window.storage && typeof window.storage.get === 'function'){
      try{
        const r = await window.storage.get(key, false);
        if(r && r.value != null){
          // Keep a local fallback copy too.
          try{ localStorage.setItem(key, r.value); }catch(_){}
          return JSON.parse(r.value);
        }
      }catch(_){}
    }

    // Standard persistent fallback.
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    console.error('[MFIX LOAD]', key, e);
    return null;
  }
}

    repairDisclaimerTemplates:['אין אחריות על מסך שהוחלף','המכשיר נבדק ונמצא תקין בעת הקבלה','אין אחריות על נזקי נוזלים','הלקוח אחראי לגיבוי הנתונים לפני התיקון','אין אחריות על חלקים לא מקוריים'],
    // סליקת אשראי (API)
    creditClearingEnabled:false,
    creditProviderName:'',
    creditApiEndpoint:'',
    creditApiKey:'',
    creditMerchantId:'',
    creditTerminalId:'',
    creditApiSecret:'',
    // Printer profiles (foundation for multi-printer management)
    printers:[],
    defaultPrinterId:'',
    printerAutoPrint:true,
    printerCopies:1,
    printerPaperWidth:'80mm',
    yeshInvoiceEnabled:false,
    yeshInvoiceEndpoint:'',

}

async function loadAll(){
  const [settings, products, customers, sales, repairs, misc] = await Promise.all([
    loadKey(STORAGE_KEYS.settings), loadKey(STORAGE_KEYS.products),
    loadKey(STORAGE_KEYS.customers), loadKey(STORAGE_KEYS.sales), loadKey(STORAGE_KEYS.repairs),
    loadKey(STORAGE_KEYS.misc)
  ]);
  STATE.settings = settings || defaultSettings();
  // backfill any new settings fields for existing users upgrading from an older version
  Object.assign(STATE.settings, Object.fromEntries(Object.entries(defaultSettings()).filter(([k])=> !(k in STATE.settings))));
  STATE.products = products || seedProducts();
  STATE.customers = customers || seedCustomers();
  STATE.sales = sales || [];
  STATE.repairs = repairs || [];
  STATE.returns = (misc && misc.returns) || [];
  STATE.shifts = (misc && misc.shifts) || [];
  STATE.giftCards = (misc && misc.giftCards) || [];
  STATE.preorders = (misc && misc.preorders) || [];
  STATE.auditLog = (misc && misc.auditLog) || [];
  STATE.currentShift = STATE.shifts.find(s=>s.status==='open') || null;
  if(!settings) await saveKey(STORAGE_KEYS.settings, STATE.settings);
  if(!products) await saveKey(STORAGE_KEYS.products, STATE.products);
  if(!customers) await saveKey(STORAGE_KEYS.customers, STATE.customers);
  STATE.loaded = true;
}

/* Debounced writer: collapses bursts of rapid changes to the same key into a single network write,
   which is both faster and far less likely to hit any write-rate limits. */
const saveTimers = {};
const pendingSync = {};
async function scheduleSave(key, valueGetter, part){
  return new Promise(resolve=>{
    if(saveTimers[key]) clearTimeout(saveTimers[key].t);
    saveTimers[key] = {
      resolvers: [...(saveTimers[key]?saveTimers[key].resolvers:[]), resolve],
      t: setTimeout(async ()=>{
        const resolvers = saveTimers[key].resolvers;
        delete saveTimers[key];
        const silent = !!pendingSync[part]; // if we're already in a failed/retry state, don't spam more error toasts
        const ok = await saveKey(key, valueGetter(), {silent});
        pendingSync[part] = !ok;
        resolvers.forEach(r=>r(ok));
      }, 400)
    };
  });
}
function miscBundle(){
  return {returns:STATE.returns, shifts:STATE.shifts, giftCards:STATE.giftCards, preorders:STATE.preorders, auditLog:STATE.auditLog};
}
async function persist(part){
  const directMap = {settings:'settings', products:'products', customers:'customers', sales:'sales', repairs:'repairs'};
  if(directMap[part]){
    const valueGetter = {
      settings:()=>STATE.settings, products:()=>STATE.products, customers:()=>STATE.customers,
      sales:()=>STATE.sales, repairs:()=>STATE.repairs
    }[part];
    scheduleSave(STORAGE_KEYS[part], valueGetter, part); // not awaited: UI proceeds immediately, write happens in background
    return;
  }
  if(MISC_PARTS.includes(part)){
    scheduleSave(STORAGE_KEYS.misc, miscBundle, 'misc');
    return;
  }
}
async function retryPendingSync(){
  const parts = Object.keys(pendingSync).filter(k=>pendingSync[k]);
  for(const part of parts){
    if(part==='misc') await scheduleSave(STORAGE_KEYS.misc, miscBundle, 'misc');
    else await persist(part);
  }
}
setInterval(retryPendingSync, 20000);

// MFIX persistent-save safety: flush current state before refresh/close.
window.addEventListener('beforeunload', ()=>{
  try{
    localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(STATE.settings));
    localStorage.setItem(STORAGE_KEYS.products, JSON.stringify(STATE.products));
    localStorage.setItem(STORAGE_KEYS.customers, JSON.stringify(STATE.customers));
    localStorage.setItem(STORAGE_KEYS.sales, JSON.stringify(STATE.sales));
    localStorage.setItem(STORAGE_KEYS.repairs, JSON.stringify(STATE.repairs));
    localStorage.setItem(STORAGE_KEYS.misc, JSON.stringify(miscBundle()));
  }catch(e){
    console.error('[MFIX FINAL SAVE]', e);
  }

/* ---- Promotions engine ---- */
function activePromotions(){ return (STATE.settings.promotions||[]).filter(p=>p.active); }
function computeCartCalc(){
  const promos = activePromotions();
  const lines = STATE.cart.map(l=>({...l, lineTotal: round2(l.unitPrice*l.qty), discount:0}));
  const notes = [];
  promos.forEach(promo=>{
    if(promo.type!=='buyXgetYfree') return;
    const scopeLines = lines.filter(l=>{
      if(promo.appliesTo==='all') return true;
      if(promo.appliesTo==='category'){ const pr=getProduct(l.productId); return pr && pr.category===promo.categoryOrProductId; }
      if(promo.appliesTo==='product'){ return l.productId===promo.categoryOrProductId; }
      return false;
    });
    // expand into individual units sorted by price desc (customer pays for expensive ones, gets cheap free)
    let units = [];
    scopeLines.forEach(l=>{ for(let i=0;i<l.qty;i++) units.push({line:l, price:l.unitPrice}); });
    if(!units.length) return;
    units.sort((a,b)=>b.price-a.price);
    const groupSize = promo.buy + promo.free;
    let freeCount = 0;
    for(let i=0;i<units.length;i++){
      const posInGroup = i % groupSize;
      if(posInGroup >= promo.buy) freeCount++;
    }
    if(freeCount>0){
      // discount = sum of cheapest `freeCount` units' prices
      const cheapest = units.slice().sort((a,b)=>a.price-b.price).slice(0,freeCount);
      const discAmt = round2(cheapest.reduce((a,u)=>a+u.price,0));
      // distribute discount proportionally onto lines within scope
      let remaining = discAmt;
      scopeLines.forEach((l,idx)=>{
        const share = idx===scopeLines.length-1 ? remaining : round2(discAmt * (l.lineTotal/units.reduce((a,u)=>a+u.price,0)));
        l.discount += Math.min(share, l.lineTotal-l.discount);
        remaining -= share;
      });
      notes.push(`מבצע "${promo.name}" הופעל: ${freeCount} יח' חינם (${money(discAmt)} הנחה)`);
    }
  });
  const subtotalIncl = round2(lines.reduce((a,l)=>a+l.lineTotal,0));
  const totalDiscount = round2(lines.reduce((a,l)=>a+l.discount,0));
  const totalIncl = round2(subtotalIncl - totalDiscount);
  const vatSplit = splitVat(totalIncl);
  return {lines, subtotalIncl, totalDiscount, totalIncl, vat:vatSplit.vat, base:vatSplit.base, notes};
}

/* ---- Loyalty points redemption ---- */
function customerPointsValue(c){ return round2((c&&c.loyaltyPoints||0) * (STATE.settings.loyaltyRedeemRate||0)); }
function maxRedeemablePoints(calc){
  if(!STATE.cartCustomerId) return 0;
  const c = getCustomer(STATE.cartCustomerId);
  if(!c) return 0;
  const balance = c.loyaltyPoints||0;
  if(balance < (STATE.settings.loyaltyMinPointsToRedeem||0)) return 0;
  const rate = STATE.settings.loyaltyRedeemRate||0;
  if(rate<=0) return 0;
  const maxSaleValue = calc.totalIncl * ((STATE.settings.loyaltyMaxRedeemPercent||100)/100);
  const maxPointsByValue = Math.floor(maxSaleValue / rate);
  return Math.max(0, Math.min(balance, maxPointsByValue));
}
function calcWithRedeem(){
  const calc = computeCartCalc();
  const maxPts = maxRedeemablePoints(calc);
  const pts = Math.max(0, Math.min(Number(STATE.pointsToRedeem)||0, maxPts));
  STATE.pointsToRedeem = pts;
  const rate = STATE.settings.loyaltyRedeemRate||0;
  const redeemValue = round2(Math.min(pts*rate, calc.totalIncl));
  const totalAfter = round2(calc.totalIncl - redeemValue);
  const vatSplit = splitVat(totalAfter);
  return {...calc, preRedeemTotal:calc.totalIncl, redeemPoints:pts, redeemValue, totalIncl:totalAfter, vat:vatSplit.vat, base:vatSplit.base};
}

async function deleteParkedSale(id){

async function clearCreditRow(idx){
  const r = paymentRows[idx];
  const s = STATE.settings;
  r.clearing = true; renderPaymentRows();
  try{
    const res = await fetch(s.creditApiEndpoint, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        apiKey:s.creditApiKey, secret:s.creditApiSecret, merchantId:s.creditMerchantId, terminalId:s.creditTerminalId,
        amount:Number(r.amount)||0, currency:'ILS'
      })
    });
    const data = await res.json().catch(()=>null);
    if(res.ok && data && data.approved){
      r.cleared = true; r.transactionId = data.transactionId||''; r.approvalCode = data.approvalCode||data.transactionId||'';
      toast('הסליקה אושרה בהצלחה','ok');
    } else {
      r.cleared = false;
      toast('הסליקה נדחתה על ידי הספק'+(data&&data.message? (': '+data.message):''),'err');
    }
  }catch(e){
    r.cleared = false;
    toast('לא ניתן להתחבר לספק הסליקה. ודאו שכתובת ה-API וההגדרות תקינות.','err');
  }
  r.clearing = false;
  renderPaymentRows();
  refreshPaymentTotals();
}
function addPaymentRow(){
  paymentRows.push({method:STATE.settings.paymentMethods[0].id, amount:0});
  renderPaymentRows();
}
function refreshPaymentTotals(){
  const calc = calcWithRedeem();
  const paid = round2(paymentRows.reduce((a,r)=>a+(Number(r.amount)||0),0));
  const change = round2(paid - calc.totalIncl);
  document.getElementById('paidLabel').textContent = money(paid);
  const changeEl = document.getElementById('changeLabel');
  changeEl.textContent = money(Math.abs(change));
  changeEl.parentElement.style.color = change>=0? 'var(--green-600)':'var(--red-600)';
  changeEl.parentElement.firstElementChild.textContent = change>=0?'עודף להחזיר':'חסר תשלום';
}

async function finalizeSale(){
  const calc = calcWithRedeem();
  if(!paymentRows.length){ toast('יש לבחור לפחות אמצעי תשלום אחד','err'); return; }
  for(const r of paymentRows){
    const amount=Number(r.amount);
    if(!Number.isFinite(amount) || amount<=0){ toast('כל אמצעי תשלום חייב להכיל סכום חיובי','err'); return; }
    if(!r.method){ toast('חסר אמצעי תשלום','err'); return; }
  }
  const paid = round2(paymentRows.reduce((a,r)=>a+Number(r.amount),0));
  if(paid < calc.totalIncl - 0.01){ toast('הסכום ששולם נמוך מהסכום לתשלום','err'); return; }

  // Final stock validation: prevents checkout when another sale/edit changed inventory while cart was open.
  for(const l of calc.lines){
    if(l.isGiftCardSale || l.linkedPreorderId || l.isPart) continue;
    const p=getProduct(l.productId);
    if(!p){ toast('המוצר "'+l.name+'" כבר לא קיים במלאי','err'); return; }
    if(p.trackSerial){
      const unit=(p.imeis||[]).find(i=>i.imei1===l.imei && i.status==='available');
      if(!unit){ toast('יחידת IMEI עבור "'+l.name+'" אינה זמינה יותר. רעננו את העגלה.','err'); return; }
    }else if((Number(p.stock)||0) < Number(l.qty||0)){
      toast('אין מספיק מלאי עבור "'+l.name+'". זמין: '+(Number(p.stock)||0),'err'); return;
    }
  }

  // Change may only be returned against cash paid in this checkout.
  const change=round2(paid-calc.totalIncl);
  const cashPaid=round2(paymentRows.filter(r=>r.method==='cash').reduce((a,r)=>a+(Number(r.amount)||0),0));
  if(change>cashPaid+0.01){
    toast('העודף גדול מהמזומן ששולם. לא ניתן לתת עודף מתשלום באשראי/שובר.','err'); return;
  }

  for(const r of paymentRows){
    if(r.method==='credit'){
      if(STATE.settings.creditClearingEnabled && !r.cleared){ toast('יש לבצע סליקה לפני סיום המכירה','err'); return; }
      if(!STATE.settings.creditClearingEnabled && !(r.approvalCode||'').trim()){ toast('יש להזין מספר אישור ידני עבור אשראי','err'); return; }
    }
  }

  // Validate gift card payments in aggregate, so the same card cannot be overdrawn via split rows.
  const giftCardTotals={};
  for(const r of paymentRows){
    if(r.method==='giftcard'){
      const code=(r.giftCode||'').trim().toUpperCase();
      if(!code){ toast('יש להזין קוד שובר מתנה','err'); return; }
      giftCardTotals[code]=round2((giftCardTotals[code]||0)+Number(r.amount));
    }
    if(r.method==='credit' && STATE.settings.creditClearingEnabled && !r.cleared){
      toast('יש לסלוק את תשלום האשראי (לחצו "סלוק כעת") לפני השלמת המכירה','err'); return;
    }
  }
  for(const [code,total] of Object.entries(giftCardTotals)){
    const card=STATE.giftCards.find(g=>g.code===code);
    if(!card){ toast('קוד שובר לא נמצא: '+code,'err'); return; }
    if(Number(card.balance)<total-0.01){ toast('יתרת השובר '+code+' ('+money(card.balance)+') נמוכה מסך התשלום '+money(total),'err'); return; }
  }
  const docType = document.getElementById('docTypeSelect').value;
  const isInvoice = docType==='invoice_receipt';
  const number = isInvoice ? STATE.settings.invoiceCounter : STATE.settings.receiptCounter;
  const sale = {
    id:uid('sale'), number, docType, date:todayISO(),
    customerId: STATE.cartCustomerId||null,
    manualCustomerName: STATE.cartCustomerId ? '' : (STATE.docCustomerName||'').trim(),
    manualCustomerPhone: STATE.cartCustomerId ? '' : (STATE.docCustomerPhone||'').trim(),
    items: calc.lines.map(l=>({
      productId:l.productId, name:l.name, qty:l.qty, unitPrice:l.unitPrice, discount:l.discount, imei:l.imei||'', serial:l.serial||'',
      warrantyMonths: l.warrantyMonths>0 ? l.warrantyMonths : undefined,
      warrantyUntil: l.warrantyMonths>0 ? addMonths(todayISO(), l.warrantyMonths).toISOString() : undefined,
      giftCardCode: l.isGiftCardSale ? '' : undefined // filled in after code generation below
    })),
    payments: paymentRows.map(r=>({method:r.method, amount:round2(Number(r.amount)||0), giftCode:r.method==='giftcard'?(r.giftCode||'').trim().toUpperCase():undefined, approvalCode:r.method==='credit'?(r.approvalCode||''):undefined, transactionId:r.method==='credit'?(r.transactionId||''):undefined, clearingMode:r.method==='credit'?(STATE.settings.creditClearingEnabled?'gateway':'manual'):undefined})),
    subtotal:calc.subtotalIncl, discount:calc.totalDiscount, vat:calc.vat, base:calc.base, total:calc.totalIncl,
    pointsRedeemed: calc.redeemPoints||0, redeemDiscount: calc.redeemValue||0,
    pointsEarned:0,
    change: round2(paid-calc.totalIncl),
    linkedRepairId: STATE.linkedRepairId||null,
    businessSnapshot:{name:STATE.settings.businessName, taxId:STATE.settings.taxId, businessType:STATE.settings.businessType, address:STATE.settings.address, phone:STATE.settings.phone}
  };
  // decrement stock / mark IMEI sold / issue new gift cards / update linked preorders.
  // Use a sequential async loop because inventory history persistence is awaited.
  let touchedGiftCards=false, touchedPreorders=false;
  for(let idx=0; idx<calc.lines.length; idx++){
    const l=calc.lines[idx];
    if(l.isGiftCardSale){
      const code = generateGiftCardCode();
      STATE.giftCards.push({code, initialValue:l.unitPrice, balance:l.unitPrice, issuedDate:todayISO(), issuedSaleId:sale.id, customerId:STATE.cartCustomerId||null});
      sale.items[idx].giftCardCode = code;
      touchedGiftCards = true;
      return;
    }
    if(l.linkedPreorderId){
      const po = STATE.preorders.find(p=>p.id===l.linkedPreorderId);
      if(po){
        po.depositPaid = round2((po.depositPaid||0) + l.unitPrice);
        po.remaining = round2(Math.max(0, po.totalPrice - po.depositPaid));
        if(po.remaining<=0) po.status='נמסר';
        touchedPreorders = true;
      }
      return;
    }
    const p = getProduct(l.productId);
    if(!p) return;
    if(p.trackSerial){
      const before=productAvailableQty(p);
      const row = p.imeis.find(i=>i.imei1===l.imei && (!l.serial || i.serial===l.serial));
      if(!row){ toast('יחידת IMEI/Serial השתנתה במהלך המכירה: '+l.name,'err'); return; }
      {
        row.status='sold'; row.soldDate=todayISO(); row.soldTo=STATE.cartCustomerId||null; row.saleId=sale.id;
        if(l.warrantyMonths>0){ row.warrantyMonths=l.warrantyMonths; row.warrantyUntil=addMonths(todayISO(), l.warrantyMonths).toISOString(); }
        await addInventoryHistory(p.id,'מכירת יחידה סריאלית',-1,before,before-1,'מסמך #'+number+' | Serial: '+(row.serial||'')+' | IMEI: '+(row.imei1||''));
      }
    } else if(!p.isPart){
      const before=Number(p.stock)||0;
      p.stock = before - l.qty;
      await addInventoryHistory(p.id,'מכירה',-l.qty,before,p.stock,'מסמך #'+number);
    }
  }
  // deduct redeemed gift card balances
  paymentRows.forEach(r=>{
    if(r.method==='giftcard'){
      const code = (r.giftCode||'').trim().toUpperCase();
      const card = STATE.giftCards.find(g=>g.code===code);
      if(card){ card.balance = round2(card.balance - Number(r.amount)); touchedGiftCards=true; }
    }
  });
  if(touchedGiftCards) await persist('giftCards');
  if(touchedPreorders) await persist('preorders');
  // loyalty points: deduct redeemed points, then earn new points on the net amount actually paid
  if(STATE.settings.loyaltyEnabled && STATE.cartCustomerId){
    const c = getCustomer(STATE.cartCustomerId);
    if(c){
      const earned = round2(calc.totalIncl*STATE.settings.loyaltyPointsPerShekel);
      sale.pointsEarned = earned;
      c.loyaltyPoints = round2((c.loyaltyPoints||0) - (calc.redeemPoints||0) + earned);
    }
    await persist('customers');
  }
  // if linked to a repair, mark it delivered/converted
  if(STATE.linkedRepairId){
    const rep = STATE.repairs.find(r=>r.id===STATE.linkedRepairId);
    if(rep){ rep.status='נמסר'; rep.convertedToSaleId=sale.id; }
    await persist('repairs');
  }
  STATE.sales.push(sale);
  if(isInvoice) STATE.settings.invoiceCounter++; else STATE.settings.receiptCounter++;
  await persist('sales'); await persist('products'); await persist('settings');
  logAudit('מכירה', `מסמך #${number}, סכום ${money(sale.total)}`);
  if(STATE.settings.yeshInvoiceEnabled && STATE.settings.yeshInvoiceSyncMode==='auto') await syncSaleToYeshInvoice(sale);
  closeModal();
  clearCart();
  toast('המכירה בוצעה בהצלחה! מסמך מס\' '+number,'ok');
  openReceiptModal(sale);
}

async function saveRepairAndPrint(repairId){
  // Open/claim USB immediately inside the real user click.
  let device,endpoint;
  try{
    device=await mfixGetUsbPrinter();
    endpoint=await mfixOpenUsbOutEndpoint(device);
  }catch(e){
    alert('לא ניתן לפתוח את המדפסת:\\n\\n'+(e?.message||e));
    return;
  }

  const id=await saveRepair(repairId);
  if(!id)return;
  const r=STATE.repairs.find(x=>x.id===id);
  if(!r)return;

  try{
    const receiptHtml=buildRepairThermalHTML(r);
    const {raster,height,bytesPerLine}=await mfixReceiptToRaster(receiptHtml);
    const xL=bytesPerLine&255, xH=(bytesPerLine>>8)&255;
    const init=new Uint8Array([0x1b,0x40,0x1b,0x61,0x00,0x1b,0x32]);
    await mfixTransfer(device,endpoint,init);

    const MAX_ROWS_PER_STRIP=180;
    let row=0;
    while(row<height){
      const rows=Math.min(MAX_ROWS_PER_STRIP,height-row);
      const yyL=rows&255, yyH=(rows>>8)&255;
      const stripHeader=new Uint8Array([0x1d,0x76,0x30,0x00,xL,xH,yyL,yyH]);
      const start=row*bytesPerLine;
      const strip=raster.slice(start,start+rows*bytesPerLine);
      const packet=mfixConcat([stripHeader,strip]);
      const result=await device.transferOut(endpoint,packet);
      if(result.status && result.status!=='ok')throw new Error('USB transfer failed: '+result.status);
      row+=rows;
    }
    await mfixTransfer(device,endpoint,new Uint8Array([0x1b,0x64,0x03,0x1d,0x56,0x42,0x00]));
    toast('טופס התיקון נשמר והודפס ✓','ok');
  }catch(e){
    console.error('[MFIX REPAIR SAVE+PRINT]',e);
    alert('הטופס נשמר, אבל ההדפסה נכשלה:\\n\\n'+(e?.message||e));
  }
}

function repairTotal(r){
  const partsTotal = (r.partsUsed||[]).reduce((a,pu)=>a+pu.qty*pu.price,0);
  return round2(partsTotal + (Number(r.laborCost)||0));
}
function loadRepairIntoCart(repairId){
  const r = STATE.repairs.find(x=>x.id===repairId);
  if(!r) return;
  STATE.cart = [];
  (r.partsUsed||[]).forEach(pu=>{
    const p = getProduct(pu.productId);
    STATE.cart.push({lineId:uid('ln'), productId:pu.productId, name:(p?p.name:'חלק חילוף'), qty:pu.qty, unitPrice:pu.price});
  });
  if(Number(r.laborCost)>0){
    // build a fully descriptive line so the sale document reflects exactly what was repaired
    let laborName = `עבודת טכנאי — ${r.deviceModel}`;
    laborName += ` | תקלה שדווחה: ${r.issueDescription}`;
    if(r.resolutionNotes) laborName += ` | בוצע: ${r.resolutionNotes}`;
    laborName += ` (טופס תיקון #${r.number})`;
    STATE.cart.push({lineId:uid('ln'), productId:'labor', name:laborName, qty:1, unitPrice:Number(r.laborCost)});
  }
  STATE.cartCustomerId = r.customerId || null;
  STATE.linkedRepairId = r.id;
  closeModal();
  switchTab('pos');
  toast('טופס התיקון נטען לקופה');
}

/* ===================== MFIX DIRECT USB RECEIPT PRINT ===================== */
let MFIX_USB_PRINTER = null;

async function mfixLoadHtml2Canvas(){
  if(window.html2canvas) return true;
  return await new Promise((resolve)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload=()=>resolve(true);
    s.onerror=()=>resolve(false);
    document.head.appendChild(s);
  });
}

async function mfixGetUsbPrinter(){
  if(!navigator.usb) throw new Error('WebUSB לא נתמך בדפדפן הזה.');
  const allowed=await navigator.usb.getDevices();
  if(MFIX_USB_PRINTER && allowed.includes(MFIX_USB_PRINTER)) return MFIX_USB_PRINTER;
  if(allowed.length){ MFIX_USB_PRINTER=allowed[0]; return MFIX_USB_PRINTER; }
  MFIX_USB_PRINTER=await navigator.usb.requestDevice({filters:[]});
  return MFIX_USB_PRINTER;
}

async function mfixOpenUsbOutEndpoint(device){
  if(!device.opened) await device.open();
  if(!device.configuration){
    const cfg=(device.configurations && device.configurations[0]) ? device.configurations[0].configurationValue : 1;
    await device.selectConfiguration(cfg);
  }

  let found=null;
  for(const iface of device.configuration.interfaces){
    for(const alt of iface.alternates){
      const ep=alt.endpoints.find(e=>e.direction==='out');
      if(ep){
        found={iface:iface.interfaceNumber,alt:alt.alternateSetting,endpoint:ep.endpointNumber};
        break;
      }
    }
    if(found) break;
  }
  if(!found) throw new Error('לא נמצאה יציאת USB למדפסת.');

  try{ await device.claimInterface(found.iface); }catch(_){}
  MFIX_USB_CLAIMED_IFACE = found.iface;
  try{ await device.selectAlternateInterface(found.iface,found.alt); }catch(_){}
  return found.endpoint;
}

async function mfixReceiptToRaster(receiptHtml){
  const ok=await mfixLoadHtml2Canvas();
  if(!ok) throw new Error('לא ניתן לטעון את מנוע ההדפסה.');

  const host=document.createElement('div');
  host.id='mfix-usb-raster-root';
  host.style.cssText='position:fixed;left:-10000px;top:0;width:72mm;background:#fff;z-index:-1;';
  mfixAddRasterCss(host);

  const wrapper=document.createElement('div');
  wrapper.innerHTML=receiptHtml;
  host.appendChild(wrapper);
  document.body.appendChild(host);

  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

    const targetWidth=576;
    const cssWidth=host.getBoundingClientRect().width || 272;
    const scale=targetWidth/cssWidth;

    const canvas=await html2canvas(host,{
      backgroundColor:'#fff',
      scale:scale,
      logging:false,
      useCORS:true,
      allowTaint:true,
      width:Math.ceil(cssWidth),
      height:Math.ceil(host.scrollHeight)
    });

    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    const img=ctx.getImageData(0,0,canvas.width,canvas.height);
    const d=img.data;

    let lastInk=0;
    for(let y=0;y<canvas.height;y++){
      let ink=false;
      for(let x=0;x<canvas.width;x+=2){
        const p=(y*canvas.width+x)*4;
        const lum=(d[p]*299+d[p+1]*587+d[p+2]*114)/1000;
        if(lum<245){ink=true;break}
      }
      if(ink) lastInk=y;
    }

    const finalHeight=Math.max(24,Math.min(canvas.height,lastInk+20));
    const bytesPerLine=Math.ceil(targetWidth/8);
    const raster=new Uint8Array(bytesPerLine*finalHeight);

    for(let y=0;y<finalHeight;y++){
      for(let x=0;x<targetWidth;x++){
        const p=(y*canvas.width+x)*4;
        const lum=(d[p]*299+d[p+1]*587+d[p+2]*114)/1000;
        if(lum<180){
          raster[y*bytesPerLine+(x>>3)] |= (0x80>>(x&7));
        }
      }
    }
    return {raster,height:finalHeight,bytesPerLine};
  }finally{
    host.remove();
  }
}

function mfixConcat(parts){
  const total=parts.reduce((n,p)=>n+p.length,0);
  const out=new Uint8Array(total);
  let off=0;
  for(const p of parts){out.set(p,off);off+=p.length}
  return out;
}

async function mfixTransfer(device,endpoint,data){
  const CHUNK=4096;
  for(let i=0;i<data.length;i+=CHUNK){
    await device.transferOut(endpoint,data.slice(i,i+CHUNK));
  }
}

async function mfixDirectUsbPrint(receiptHtml){
  try {

  // Android APK: keep the exact MFIX raster renderer, but hand the final bitmap
  // to the native USB bridge instead of WebUSB.
  if(window.AndroidPrinter && typeof window.AndroidPrinter.printRaster==='function'){
    const {raster,height,bytesPerLine}=await mfixReceiptToRaster(receiptHtml);
    let binary='';
    const CH=0x8000;
    for(let i=0;i<raster.length;i+=CH){
      binary += String.fromCharCode.apply(null, raster.subarray(i,Math.min(raster.length,i+CH)));
    }
    const b64=btoa(binary);
    const profile=(STATE.settings.printers||[]).find(p=>p.id===STATE.settings.defaultPrinterId);
    if(profile && profile.type==='USB' && profile.address && typeof window.AndroidPrinter.printRasterToDevice==='function'){
      window.AndroidPrinter.printRasterToDevice(profile.address,b64,bytesPerLine,height);
    }else{
      window.AndroidPrinter.printRaster(b64,bytesPerLine,height);
    }
    return;
  }

  const device=await mfixGetUsbPrinter();
  const endpoint=await mfixOpenUsbOutEndpoint(device);
  const {raster,height,bytesPerLine}=await mfixReceiptToRaster(receiptHtml);

  const xL=bytesPerLine&255, xH=(bytesPerLine>>8)&255;
  const yL=height&255, yH=(height>>8)&255;

  const init=new Uint8Array([
    0x1b,0x40,       // ESC @ reset
    0x1b,0x61,0x00,  // ESC a 0 left align
    0x1b,0x32        // ESC 2 default line spacing
  ]);

  /*
    IMPORTANT:
    Do NOT split the GS v 0 raster command arbitrarily.
    Some Xprinter firmware treats a new USB transfer as a new parser block.
    If header and bitmap are split, the bitmap bytes are interpreted as text,
    which is exactly what caused the Chinese/random characters.
  */
  const header=new Uint8Array([0x1d,0x76,0x30,0x00,xL,xH,yL,yH]);

  // Send one complete raster command per horizontal strip.
  // Each strip has its own GS v 0 header, so no USB packet boundary can corrupt it.
  const MAX_ROWS_PER_STRIP=180;
  await mfixTransfer(device,endpoint,init);

  let row=0;
  while(row<height){
    const rows=Math.min(MAX_ROWS_PER_STRIP,height-row);
    const yyL=rows&255, yyH=(rows>>8)&255;
    const stripHeader=new Uint8Array([0x1d,0x76,0x30,0x00,xL,xH,yyL,yyH]);
    const start=row*bytesPerLine;
    const end=start+rows*bytesPerLine;
    const strip=raster.slice(start,end);

    // Header + its exact bitmap payload are sent together.
    const packet=mfixConcat([stripHeader,strip]);
    const result=await device.transferOut(endpoint,packet);
    if(result.status && result.status!=='ok'){
      throw new Error('USB transfer failed: '+result.status);
    }
    row+=rows;
  }

  // Small feed and cut are separate commands only after raster data is complete.
  const finish=new Uint8Array([
    0x1b,0x64,0x03,      // feed 3 lines
    0x1d,0x56,0x42,0x00 // partial cut
  ]);
  await mfixTransfer(device,endpoint,finish);

  } finally {
    await mfixReleaseUsbPrinterAfterPrint();
  }
}

async function printDoc(saleId){
  const sale=findSale(saleId);
  const fmt=previewFormatOverride || STATE.settings.printerFormat;
  const receipt=buildReceiptHTML(sale,'print');

  if(fmt!=='thermal80'){
    openPrintWindow(receipt,'הדפסה #'+sale.number,false);
    return;
  }

  try{
    const copies=Math.max(1,Number(STATE.settings.printerCopies)||1);
    for(let i=0;i<copies;i++) await mfixDirectUsbPrint(receipt);
    toast('הקבלה נשלחה למדפסת'+(copies>1?' ('+copies+' עותקים)':''),'ok');
  }catch(e){
    console.error('[MFIX USB PRINT]',e);
    alert('הדפסה ישירה לא בוצעה:\\n\\n'+(e?.message||e)+'\\n\\nבפעם הראשונה יש לבחור את מדפסת Xprinter בחלון ה-USB של Chrome.');
  }
}

async function sendDocSMS(saleId){
  const sale = findSale(saleId);
  const phone = saleDisplayPhone(sale);
  if(!phone){ toast('לא הוזן מספר טלפון למסמך זה','err'); return; }
  const s = STATE.settings;
  if(!s.smsApiEndpoint){
    toast('לא הוגדר ספק SMS בהגדרות. עברו להגדרות > הודעות כדי לחבר ספק (למשל: אינפורייל, Vonage וכד\').','amber');

  }
  try{
    const res = await fetch(s.smsApiEndpoint, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({apiKey:s.smsApiKey, to:phone, message:docSummaryText(sale)})
    });

  }
}

function normalizeImei(value){ return String(value||'').replace(/[^0-9]/g,''); }
function isValidImei(value){
  const s=normalizeImei(value); if(!/^\d{15}$/.test(s)) return false;
  let sum=0;
  for(let i=0;i<15;i++){ let d=Number(s[14-i]); if(i%2===1){ d*=2; if(d>9)d-=9; } sum+=d; }
  return sum%10===0;
}
async function saveNewImei(productId){
  if(!canManage()){toast('הוספת יחידת IMEI דורשת הרשאת מנהל','err');return;}
  const p = getProduct(productId);
  const serial = document.getElementById('newSerial').value.trim();
  const imei1 = normalizeImei(document.getElementById('newImei1').value);
  const imei2 = normalizeImei(document.getElementById('newImei2').value);
  if(!p){toast('המוצר לא נמצא','err');return;}
  if(!serial || !imei1){ toast('יש למלא סריאל ו-IMEI 1','err'); return; }
  if(!isValidImei(imei1) || (imei2 && !isValidImei(imei2))){ toast('IMEI חייב להיות מספר תקין בן 15 ספרות','err'); return; }
  // duplicate check across the entire inventory, not just this product — prevents accidental double-entry
  for(const prod of STATE.products){
    if(!prod.trackSerial) continue;
    const dup = prod.imeis.find(i=> i.serial===serial || i.imei1===imei1 || (imei2 && (i.imei1===imei2 || i.imei2===imei2)) || (i.imei2 && i.imei2===imei1));
    if(dup){ toast(`הסריאל/IMEI כבר קיים במלאי תחת "${prod.name}" (סריאל ${dup.serial})`,'err'); return; }
  }
  const before=productAvailableQty(p);
  p.imeis.push({id:uid('imei'), serial, imei1, imei2, status:'available'});
  await persist('products');
  await addInventoryHistory(productId,'הוספת יחידה סריאלית',1,before,before+1,'Serial: '+serial+' | IMEI: '+imei1);
  logAudit('הוספת יחידת IMEI',p.name+' | Serial: '+serial+' | IMEI: '+imei1); await persist('auditLog');
  closeModal(); renderInvTable(); toast('היחידה נוספה למלאי','ok');
}
async function removeImeiUnit(productId, imeiId){
  if(!canManage()){toast('הסרת יחידת IMEI דורשת הרשאת מנהל','err');return;}
  const p = getProduct(productId);
  const row=(p.imeis||[]).find(i=>i.id===imeiId);
  if(!row || row.status!=='available'){ toast('ניתן להסיר רק יחידה זמינה שלא נמכרה','err'); return; }
  const before=productAvailableQty(p);
  if(!confirm('להסיר מהמלאי את '+row.serial+'?')) return;
  p.imeis = p.imeis.filter(i=>i.id!==imeiId);
  await persist('products');
  await addInventoryHistory(productId,'הסרת יחידה סריאלית',-1,before,before-1,'Serial: '+row.serial+' | IMEI: '+row.imei1);
  logAudit('הסרת יחידת IMEI',p.name+' | Serial: '+row.serial+' | IMEI: '+row.imei1); await persist('auditLog');
  renderInvTable();
}

let inventoryImportRows = [];
let inventoryImportHeaders = [];
let inventoryImportFileName = '';

function openInventoryImport(){
  document.getElementById('inventoryImportFile')?.click();
}

function normalizeImportHeader(v){
  return String(v==null?'':v).trim().toLowerCase()
    .replace(/["'׳״]/g,'')
    .replace(/\s+/g,' ')
    .replace(/[_\-\/\\().]/g,' ');
}
function importNum(v){
  if(v==null || v==='') return 0;
  if(typeof v==='number') return Number.isFinite(v)?v:0;
  let s = String(v).trim()
    .replace(/[₪$€£]/g,'')
    .replace(/\s/g,'');
  // Handles 1,234.56 and 1.234,56 reasonably.
  if(s.includes(',') && s.includes('.')){
    if(s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',','.');
    else s = s.replace(/,/g,'');
  } else if(s.includes(',')){
    const parts=s.split(',');
    if(parts.length===2 && parts[1].length<=2) s=parts[0].replace(/\./g,'')+'.'+parts[1];
    else s=s.replace(/,/g,'');
  }
  const n=Number(s);
  return Number.isFinite(n)?n:0;
}
function importBool(v){
  const s=String(v==null?'':v).trim().toLowerCase();
  return ['1','true','yes','כן','y','✓','v'].includes(s);
}
function csvDetectDelimiter(text){
  const first=(text.split(/\r?\n/).find(x=>x.trim())||'');
  const candidates=[',',';','\t','|'];
  let best=',', score=-1;
  for(const d of candidates){
    let count=0, quoted=false;
    for(let i=0;i<first.length;i++){
      const ch=first[i];
      if(ch==='"') quoted=!quoted;
      else if(ch===d && !quoted) count++;
    }
    if(count>score){ score=count; best=d; }
  }
  return best;
}
function parseCSVText(text){
  text=String(text||'').replace(/^\uFEFF/,'');
  const d=csvDetectDelimiter(text);
  const rows=[]; let row=[], field='', quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==='"'){
      if(quoted && text[i+1]==='"'){ field+='"'; i++; }
      else quoted=!quoted;
    }else if(ch===d && !quoted){
      row.push(field); field='';
    }else if((ch==='\n' || ch==='\r') && !quoted){
      if(ch==='\r' && text[i+1]==='\n') i++;
      row.push(field); field='';
      if(row.some(x=>String(x).trim()!=='')) rows.push(row);
      row=[];
    }else field+=ch;
  }
  row.push(field);
  if(row.some(x=>String(x).trim()!=='')) rows.push(row);
  return rows;
}
async function ensureSheetJS(){
  if(window.XLSX) return true;
  return await new Promise((resolve)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=()=>resolve(true);
    s.onerror=()=>resolve(false);
    document.head.appendChild(s);
  });
}
async function handleInventoryImportFile(file){
  if(!file) return;
  inventoryImportFileName=file.name||'';
  try{
    let matrix=[];
    const ext=(file.name.split('.').pop()||'').toLowerCase();
    if(['csv','tsv','txt'].includes(ext)){
      matrix=parseCSVText(await file.text());
    }else if(['xlsx','xls'].includes(ext)){
      const ok=await ensureSheetJS();
      if(!ok){ toast('לא ניתן לטעון את מנוע Excel. בדקו חיבור לאינטרנט או שמרו את הקובץ כ-CSV.','err'); return; }
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array',cellDates:false,raw:false});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false});
    }else{
      toast('פורמט לא נתמך. אפשר CSV, XLSX, XLS, TSV או TXT.','err'); return;
    }
    matrix=matrix.filter(r=>Array.isArray(r) && r.some(v=>String(v).trim()!==''));
    if(matrix.length<2){ toast('לא נמצאו שורות מלאי בקובץ','err'); return; }

    inventoryImportHeaders=matrix[0].map((h,i)=>String(h||`עמודה ${i+1}`).trim()||`עמודה ${i+1}`);
    inventoryImportRows=matrix.slice(1).map(r=>{
      const o={};
      inventoryImportHeaders.forEach((h,i)=>o[h]=r[i]??'');
      return o;
    });
    showInventoryImportMapping();
  }catch(e){
    console.error(e);
    toast('שגיאה בקריאת קובץ המלאי: '+(e?.message||e),'err');
  }
}
const IMPORT_FIELD_ALIASES={
  name:['שם מוצר','מוצר','שם','תיאור','תאור','description','product','product name','item','item name','פריט'],
  barcode:['ברקוד','מק"ט','מקט','sku','barcode','ean','upc','code','קוד'],
  category:['קטגוריה','מחלקה','category','department','group','קבוצה'],
  cost:['מחיר עלות','עלות','cost','cost price','purchase price','מחיר קניה','מחיר קנייה'],
  price:['מחיר מכירה','מחיר','price','sale price','selling price','retail','מחיר כולל מעמ','מחיר כולל מע"מ'],
  stock:['מלאי','כמות','יתרה','stock','qty','quantity','inventory','balance'],
  serial:['סריאל','serial','serial number','sn'],
  imei1:['imei','imei1','imei 1','imei ראשון','imei ראשי'],
  imei2:['imei2','imei 2','imei שני'],

  warranty:['אחריות','חודשי אחריות','warranty','warranty months']
};
function autoMapImportField(field){
  const aliases=(IMPORT_FIELD_ALIASES[field]||[]).map(normalizeImportHeader);
  let exact=inventoryImportHeaders.find(h=>aliases.includes(normalizeImportHeader(h)));
  if(exact) return exact;
  return inventoryImportHeaders.find(h=>{
    const n=normalizeImportHeader(h);
    return aliases.some(a=>n.includes(a) || a.includes(n));
  })||'';
}
function importMapSelect(field,label,required=false){

function getImportMap(){
  const fields=['name','barcode','category','stock','cost','price','serial','imei1','imei2','warranty','isPart'];
  const m={};
  fields.forEach(f=>m[f]=document.getElementById('im_'+f)?.value||'');
  return m;
}
function rowImportValue(row,col){ return col ? row[col] : ''; }
function findExistingImportProduct(name,barcode){
  const b=String(barcode||'').trim();
  if(b){
    const byBarcode=STATE.products.find(p=>String(p.barcode||'').trim()===b);
    if(byBarcode) return byBarcode;
  }
  const n=String(name||'').trim().toLowerCase();
  return n ? STATE.products.find(p=>String(p.name||'').trim().toLowerCase()===n) : null;
}
async function commitInventoryImport(){
  const m=getImportMap();
  if(!m.name){ toast('חובה לבחור עמודה של שם מוצר','err'); return; }
  const mode=document.getElementById('im_mode')?.value||'update';
  let added=0, updated=0, skipped=0, units=0, errors=0;

  for(const row of inventoryImportRows){
    try{
      const name=String(rowImportValue(row,m.name)||'').trim();
      if(!name){ skipped++; continue; }
      const barcode=String(rowImportValue(row,m.barcode)||'').trim();
      const category=String(rowImportValue(row,m.category)||'').trim()||'כללי';
      const cost=importNum(rowImportValue(row,m.cost));
      const price=importNum(rowImportValue(row,m.price));
      const stock=Math.max(0,Math.floor(importNum(rowImportValue(row,m.stock))));
      const serial=String(rowImportValue(row,m.serial)||'').trim();
      const imei1=String(rowImportValue(row,m.imei1)||'').trim();
      const imei2=String(rowImportValue(row,m.imei2)||'').trim();
      const warrantyRaw=rowImportValue(row,m.warranty);
      const warrantyMonths=(warrantyRaw===''||warrantyRaw==null)?null:Math.max(0,Math.floor(importNum(warrantyRaw)));
      const isPart=importBool(rowImportValue(row,m.isPart));
      const isSerial=!!(serial||imei1||imei2);

      let p = mode==='new' ? null : findExistingImportProduct(name,barcode);
      if(p && mode==='skip'){ skipped++; continue; }

      if(!p){
        p={
          id:uid('p'), name, category, barcode,
          costPrice:cost, price,
          trackSerial:isSerial, isPart, warrantyMonths,
          stock:isSerial?undefined:stock,
          imeis:isSerial?[]:undefined
        };
        STATE.products.push(p); added++;
      }else{
        p.name=name || p.name;
        if(m.category) p.category=category;
        if(m.barcode && barcode) p.barcode=barcode;
        if(m.cost) p.costPrice=cost;
        if(m.price) p.price=price;
        if(m.isPart) p.isPart=isPart;
        if(m.warranty) p.warrantyMonths=warrantyMonths;
        if(isSerial){
          if(!p.trackSerial){ p.trackSerial=true; p.imeis=p.imeis||[]; delete p.stock; }
        }else if(!p.trackSerial && m.stock){
          p.stock = mode==='replace' ? stock : (Number(p.stock||0)+stock);
        }
        updated++;
      }

      if(isSerial){
        p.trackSerial=true; p.imeis=p.imeis||[];
        const s=serial || imei1 || ('UNIT-'+uid('sn'));
        const i1=imei1 || '';
        const duplicate=STATE.products.some(prod=>prod.trackSerial && (prod.imeis||[]).some(i=>
          (s && i.serial===s) || (i1 && (i.imei1===i1 || i.imei2===i1)) || (imei2 && (i.imei1===imei2 || i.imei2===imei2))
        ));
        if(!duplicate){
          p.imeis.push({id:uid('imei'),serial:s,imei1:i1,imei2,status:'available'});
          units++;
        }else skipped++;
      }
    }catch(e){ console.error(e); errors++; }
  }

  await persist('products');
  inventoryImportRows=[]; inventoryImportHeaders=[];
  closeModal(); render();
  toast(`ייבוא הסתיים: ${added} חדשים, ${updated} עודכנו${units?`, ${units} יחידות IMEI/סריאל`:''}${skipped?`, ${skipped} דולגו`:''}${errors?`, ${errors} שגיאות`:''}`,'ok');
}

async function saveStockAdjustment(){
  if(!canManage()){toast('עדכון מלאי דורש הרשאת מנהל','err');return;}
  const p=getProduct(document.getElementById('sa_product').value);
  const qty=Math.max(0,Number(document.getElementById('sa_qty').value)||0);
  const mode=document.getElementById('sa_mode').value;
  if(!p){toast('יש לבחור מוצר','err');return;}
  if(qty<=0 && mode!=='set'){toast('יש להזין כמות גדולה מאפס','err');return;}
  const old=Number(p.stock||0);
  p.stock=mode==='add'?old+qty:mode==='remove'?Math.max(0,old-qty):qty;

  p.stockHistory.unshift({date:new Date().toISOString(),mode,qty,oldStock:old,newStock:p.stock,note,role:STATE.currentRole||'cashier'});
  await persist('products');
  await addInventoryHistory(p.id,mode==='add'?'הוספת מלאי':mode==='remove'?'הפחתת מלאי':'קביעת מלאי',p.stock-old,old,p.stock,note);
  logAudit('עדכון מלאי',p.name+' | '+old+' → '+p.stock+(note?' | '+note:'')); await persist('auditLog');
  closeModal(); render(); toast('המלאי עודכן מ-'+old+' ל-'+p.stock,'ok');

async function saveProduct(productId){
  if(!canManage()){ toast('יצירה ועריכת מוצרים דורשות הרשאת מנהל','err'); return; }
  const name = document.getElementById('pf_name').value.trim();
  const category = document.getElementById('pf_category').value.trim() || 'כללי';
  const barcode = document.getElementById('pf_barcode').value.trim();
  const cost = Number(document.getElementById('pf_cost').value)||0;
  const price = Number(document.getElementById('pf_price').value)||0;
  const trackSerial = document.getElementById('pf_track').value==='1';
  const stock = Number(document.getElementById('pf_stock').value)||0;
  const isPart = document.getElementById('pf_ispart').checked;
  const warrantyRaw = document.getElementById('pf_warranty').value;
  const warrantyMonths = warrantyRaw===''? null : (Number(warrantyRaw)||0);
  if(!name){ toast('חובה להזין שם מוצר','err'); return; }
  if(productId){
    const p = getProduct(productId);
    const oldTrack=!!p.trackSerial, oldStock=productAvailableQty(p);
    if(oldTrack!==trackSerial){
      const hasSold=(p.imeis||[]).some(i=>i.status==='sold');
      if(hasSold && !trackSerial){ toast('לא ניתן לבטל ניהול סריאלי לאחר שמכרת יחידות מהמוצר','err'); return; }
      if(trackSerial && Number(p.stock||0)>0){ toast('לפני מעבר לניהול IMEI יש להגדיר את היחידות הסריאליות אחת-אחת. המלאי הכמותי נשאר עד להוספת היחידות.','err'); return; }
    }
    Object.assign(p, {name,category,barcode,costPrice:cost,price,isPart,warrantyMonths});
    if(trackSerial && !p.trackSerial) p.imeis = p.imeis||[];
    p.trackSerial = trackSerial;
    if(!trackSerial){
      p.stock = stock;
      if(oldStock!==stock) await addInventoryHistory(p.id,'עדכון מלאי בעריכת מוצר',stock-oldStock,oldStock,stock,'שינוי כמות מתוך עריכת מוצר');
    }
  } else {
    const np={id:uid('p'), name, category, barcode, costPrice:cost, price, trackSerial, isPart, warrantyMonths, stock: trackSerial?undefined:stock, imeis: trackSerial?[]:undefined};
    STATE.products.push(np);
    if(!trackSerial && stock>0) await addInventoryHistory(np.id,'מלאי פתיחה',stock,0,stock,'יצירת מוצר חדש');
  }
  await persist('products');
  const saved=productId?getProduct(productId):STATE.products[STATE.products.length-1];
  logAudit(productId?'עריכת מוצר':'יצירת מוצר',(saved?.name||name)+(barcode?' | ברקוד: '+barcode:'')); await persist('auditLog');
  closeModal(); render(); toast('המוצר נשמר בהצלחה','ok');
}
async function deleteProduct(productId){
  if(!canManage()){ toast('מחיקת מוצר דורשת הרשאת מנהל','err'); return; }
  const p=getProduct(productId); if(!p) return;
  const usedInSales=STATE.sales.some(s=>(s.items||[]).some(i=>i.productId===productId));
  if(usedInSales){ toast('לא ניתן למחוק מוצר עם היסטוריית מכירות. ניתן להשאיר אותו ללא מלאי או לערוך אותו.','err'); return; }
  if(!confirm('למחוק את המוצר לצמיתות?')) return;
  STATE.products = STATE.products.filter(p=>p.id!==productId);
  STATE.inventoryHistory=(STATE.inventoryHistory||[]).filter(h=>h.productId!==productId);
  await Promise.all([persist('products'),persist('inventoryHistory')]);
  logAudit('מחיקת מוצר',p.name||productId); await persist('auditLog'); render();
}

async function saveRepair(repairId){
  const customerId = null;
  const manualCustomerName = (document.getElementById('rf_customer_name')?.value||'').trim();
  const phone = document.getElementById('rf_phone').value.trim();
  const deviceModel = document.getElementById('rf_device').value.trim();
  const imei = document.getElementById('rf_imei').value.trim();
  const issueDescription = document.getElementById('rf_issue').value.trim();
  const status = document.getElementById('rf_status').value;
  const technician = document.getElementById('rf_tech').value.trim();
  const laborCost = Number(document.getElementById('rf_labor').value)||0;
  const notes = document.getElementById('rf_notes').value.trim();
  const dueDateRaw = document.getElementById('rf_duedate').value;
  const dueDate = dueDateRaw ? new Date(dueDateRaw+'T00:00:00').toISOString() : '';
  const resolutionNotes = document.getElementById('rf_resolution').value.trim();
  const accessoriesReceived = document.getElementById('rf_accessories').value.trim();
  const devicePasscode = document.getElementById('rf_passcode').value.trim();
  const printedDisclaimers = [...document.querySelectorAll('.rf_disclaimer_cb:checked')].map(cb=>cb.value);
  if(!deviceModel || !issueDescription){ toast('יש למלא דגם מכשיר ותיאור תקלה','err'); return; }
  const partsUsed = repairPartRows.filter(r=>r.productId);
  const commonFields = {customerId,manualCustomerName,phone,deviceModel,imei,issueDescription,status,technician,laborCost,notes,partsUsed,dueDate,resolutionNotes,accessoriesReceived,devicePasscode,printedDisclaimers};
  let newRepairId=null;
  if(repairId){
    const r = STATE.repairs.find(x=>x.id===repairId);
    Object.assign(r, commonFields);
  } else {
    const number = STATE.settings.repairCounter;
    const nr={id:uid('rep'), number, date:todayISO(), ...commonFields, convertedToSaleId:null};
    STATE.repairs.push(nr);
    newRepairId=nr.id;
    STATE.settings.repairCounter++;
    await persist('settings');
  }
  await persist('repairs');
  closeModal(); render(); toast('טופס התיקון נשמר','ok');
  return repairId || newRepairId;
}

async function printRepairTicket(repairId){
  const r=STATE.repairs.find(x=>x.id===repairId);
  if(!r){toast('טופס התיקון לא נמצא','err');return}
  const html=buildRepairThermalHTML(r);

  // EXACT same proven path as invoice/receipt:
  // HTML -> mfixReceiptToRaster -> mfixDirectUsbPrint -> Xprinter
  try{
    await mfixDirectUsbPrint(html);
    toast('טופס התיקון נשלח למדפסת','ok');
  }catch(e){
    console.error('[MFIX REPAIR USB PRINT]',e);
    alert('הדפסה ישירה של טופס התיקון לא בוצעה:\\n\\n'+(e?.message||e)+'\\n\\nהחשבונית וטופס התיקון משתמשים כעת בדיוק באותו מנגנון USB.');
  }
}
function sendRepairWhatsApp(repairId){
  const r = STATE.repairs.find(x=>x.id===repairId);
  const cust = r.customerId ? getCustomer(r.customerId) : null;
  let phone = (r.phone || (cust ? cust.phone : '') || '').replace(/\D/g,'');
  if(phone.startsWith('0')) phone = '972'+phone.slice(1);
  const msg = `שלום${cust?' '+cust.name:''}, עדכון לגבי תיקון מכשיר ${r.deviceModel} (טופס #${r.number}) מ${STATE.settings.businessName}: סטטוס נוכחי — ${r.status}. עלות משוערת: ${money(repairTotal(r))}.`;
  const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
  window.open(url,'_blank');
}

function openCustomerModal(customerId){
  const c = customerId ? getCustomer(customerId) : null;
  openModal(`

  `);

async function saveCustomer(customerId){
  const name = document.getElementById('cf_name').value.trim();
  const phone = document.getElementById('cf_phone').value.trim();
  const email = document.getElementById('cf_email').value.trim();
  const notes = document.getElementById('cf_notes').value.trim();
  if(!name || !phone){ toast('חובה למלא שם וטלפון','err'); return; }
  if(customerId){ Object.assign(getCustomer(customerId), {name,phone,email,notes}); }
  else{ STATE.customers.push({id:uid('c'), name,phone,email,notes, loyaltyPoints:0, createdAt:todayISO()}); }
  await persist('customers'); closeModal(); render(); toast('הלקוח נשמר','ok');
}
async function deleteCustomer(customerId){
  if(!canManage()){ toast('מחיקת לקוח דורשת הרשאת מנהל','err'); return; }
  const customer=getCustomer(customerId); if(!customer) return;
  const linked=STATE.sales.some(s=>s.customerId===customerId)||STATE.repairs.some(r=>r.customerId===customerId);
  if(linked){ toast('לא ניתן למחוק לקוח עם היסטוריית מכירות או תיקונים','err'); return; }
  if(!confirm('למחוק לקוח זה?')) return;
  STATE.customers = STATE.customers.filter(c=>c.id!==customerId);
  await persist('customers'); logAudit('מחיקת לקוח',customer.name||customerId); await persist('auditLog'); render();
}
function openCustomerDetail(customerId){
  const c = getCustomer(customerId);
  const sales = STATE.sales.filter(s=>s.customerId===customerId).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const repairs = STATE.repairs.filter(r=>r.customerId===customerId).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const totalSpent = sales.reduce((a,s)=>a+s.total,0);
  openModal(`
    <div class="modal-head"><h3>${esc(c.name)} — כרטיס לקוח</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">

async function onLogoFileSelected(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = async ()=>{
      // resize down to a reasonable max width to keep storage small & printing crisp
      const maxW = 300;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width*scale);
      canvas.height = Math.round(img.height*scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      STATE.settings.logoDataUrl = canvas.toDataURL('image/png');
      await persist('settings');
      render();
      toast('הלוגו הועלה בהצלחה','ok');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

async function testYeshInvoiceConnection(){
  const endpoint=(document.getElementById('st_yeshendpoint')?.value||STATE.settings.yeshInvoiceEndpoint||'').trim();
  const key=(document.getElementById('st_yeshkey')?.value||STATE.settings.yeshInvoiceApiKey||'').trim();
  if(!endpoint){toast('יש להזין Endpoint לפני בדיקת חיבור','err');return;}
  try{

    toast(res.ok||res.status===405?'ה־Endpoint הגיב ('+res.status+')':'ה־Endpoint החזיר HTTP '+res.status,res.ok||res.status===405?'ok':'err');
  }catch(e){ toast('בדיקת החיבור נכשלה: '+String(e.message||e),'err'); }
}
function getYeshInvoicePayload(sale){
  const s=STATE.settings;
  return {source:'MFIX-POS',documentType:Number(s.yeshInvoiceDocumentType)||9,sale};
}
async function syncSaleToYeshInvoice(sale){
  const s=STATE.settings;
  if(!s.yeshInvoiceEnabled || !s.yeshInvoiceEndpoint) return {skipped:true};
  if(sale.yeshInvoice?.status==='synced') return {skipped:true,reason:'already-synced'};
  const payload={source:'MFIX-POS',documentType:Number(s.yeshInvoiceDocumentType)||9,sale};
  try{
    const headers={'Content-Type':'application/json'};
    if(s.yeshInvoiceApiKey) headers.Authorization='Bearer '+s.yeshInvoiceApiKey;
    const res=await fetch(s.yeshInvoiceEndpoint,{method:'POST',headers,body:JSON.stringify(payload)});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json().catch(()=>({}));
    sale.yeshInvoice={status:'synced',syncedAt:new Date().toISOString(),responseId:data.id||data.documentId||data.number||null,lastError:null};
    await persist('sales'); logAudit('סנכרון יש חשבונית','מסמך #'+sale.number+' סונכרן'); await persist('auditLog');
    return data;
  }catch(e){
    sale.yeshInvoice={status:'failed',lastError:String(e.message||e),lastAttemptAt:new Date().toISOString(),attempts:Number(sale.yeshInvoice?.attempts||0)+1};
    await persist('sales'); logAudit('כשל סנכרון יש חשבונית','מסמך #'+sale.number+': '+String(e.message||e)); await persist('auditLog');
    return null;
  }
}

function exportBackup(){
  if(!canManage()){toast('ייצוא גיבוי דורש הרשאת מנהל','err');return;}
  const data = {
    format:'MFIX-POS-BACKUP', version:'1.3', exportedAt:new Date().toISOString(),
    meta:{app:'MFIX POS', exportedBy:STATE.currentRole||'cashier'},
    settings:STATE.settings, products:STATE.products, customers:STATE.customers,
    sales:STATE.sales, repairs:STATE.repairs, returns:STATE.returns||[],
    preorders:STATE.preorders||[], giftCards:STATE.giftCards||[],
    auditLog:STATE.auditLog||[], inventoryHistory:STATE.inventoryHistory||[],
    shifts:STATE.shifts||[], currentShift:STATE.currentShift||null
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'mfix-pos-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importBackup(evt){
  if(!canManage()){toast('ייבוא גיבוי דורש הרשאת מנהל','err'); evt.target.value=''; return;}
  const file = evt.target.files[0];
  if(!file) return;
  if(file.size>50*1024*1024){toast('קובץ הגיבוי גדול מדי (מקסימום 50MB)','err');evt.target.value='';return;}
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(data.format!=='MFIX-POS-BACKUP') throw new Error('format');
      if(!['1.2','1.3'].includes(String(data.version||''))) throw new Error('version');
      if(!data.settings || !Array.isArray(data.products) || !Array.isArray(data.customers) || !Array.isArray(data.sales)) throw new Error('structure');
      if(!confirm('ייבוא גיבוי יחליף את כל הנתונים הקיימים. להמשיך?')) return;
      STATE.settings = data.settings || STATE.settings;
      STATE.products = data.products || STATE.products;
      STATE.customers = data.customers || STATE.customers;
      STATE.sales = data.sales || STATE.sales;
      STATE.repairs = data.repairs || STATE.repairs;
      STATE.returns = data.returns || STATE.returns || [];
      STATE.preorders = data.preorders || STATE.preorders || [];
      STATE.giftCards = data.giftCards || STATE.giftCards || [];
      STATE.auditLog = data.auditLog || STATE.auditLog || [];
      STATE.inventoryHistory = data.inventoryHistory || STATE.inventoryHistory || [];
      STATE.shifts = Array.isArray(data.shifts) ? data.shifts : (STATE.shifts||[]);
      STATE.currentShift = data.currentShift || null;
      await Promise.all(['settings','products','customers','sales','repairs','returns','preorders','giftCards','auditLog','inventoryHistory','shifts','currentShift'].map(persist));
      logAudit('ייבוא גיבוי', 'גיבוי v'+(data.version||'?')+' מ-'+(data.exportedAt||'תאריך לא ידוע'));
      await persist('auditLog');
      evt.target.value='';
      render(); toast('הגיבוי יובא בהצלחה','ok');
    }catch(e){ toast('קובץ הגיבוי אינו תקין','err'); }
  };
  reader.readAsText(file);
}

  const po = {id:uid('po'), number, date:todayISO(), customerId, description, totalPrice, depositPaid:0, remaining:round2(totalPrice), status:'ממתין'};

  logAudit('הזמנה מראש', `${description} — מקדמה לגבייה ${money(depositNow)}`);

function runGlobalSearch(term){
  const wrap = document.getElementById('globalSearchResults');
  term = (term||'').trim().toLowerCase();
  if(term.length<2){ wrap.innerHTML = `<div class="muted" style="font-size:13px;">הקלידו לפחות 2 תווים כדי להתחיל בחיפוש.</div>`; return; }

  const productMatches = STATE.products.filter(p=> p.name.toLowerCase().includes(term) || (p.barcode||'').toLowerCase().includes(term));
  const imeiMatches = [];
  STATE.products.filter(p=>p.trackSerial).forEach(p=>{
    p.imeis.forEach(i=>{
      if(i.imei1.includes(term) || (i.imei2||'').includes(term) || i.serial.toLowerCase().includes(term)){
        imeiMatches.push({product:p, row:i});
      }
    });
  });
  const customerMatches = STATE.customers.filter(c=> c.name.toLowerCase().includes(term) || c.phone.includes(term));
  const saleMatches = STATE.sales.filter(s=> String(s.number).includes(term) || saleDisplayName(s).toLowerCase().includes(term) || saleDisplayPhone(s).includes(term));
  const repairMatches = STATE.repairs.filter(r=> String(r.number).includes(term) || (r.imei||'').includes(term) || r.deviceModel.toLowerCase().includes(term) || customerName(r.customerId).toLowerCase().includes(term));

  const sections = [];
  if(customerMatches.length) sections.push(`
    <div class="section-title" style="font-size:13px;">👥 לקוחות (${customerMatches.length})</div>
    ${customerMatches.map(c=>`<div class="card" style="margin-bottom:8px;cursor:pointer;" onclick="closeModal(); switchTab('customers'); setTimeout(()=>openCustomerDetail('${c.id}'),50);">
      <b>${esc(c.name)}</b> <span class="muted" style="direction:ltr;">${esc(c.phone)}</span> — <span class="pill blue">${(c.loyaltyPoints||0).toFixed(1)} נק'</span>
    </div>`).join('')}`);
  if(imeiMatches.length) sections.push(`
    <div class="section-title" style="font-size:13px;">📱 מכשירים (IMEI/סריאל) (${imeiMatches.length})</div>
    ${imeiMatches.map(m=>`<div class="card" style="margin-bottom:8px;cursor:pointer;" onclick="closeModal(); switchTab('inventory'); invExpanded['${m.product.id}']=true; invSearch='${esc(m.row.imei1)}'; setTimeout(render,50);">
      <b>${esc(m.product.name)}</b> — סריאל ${esc(m.row.serial)} <span class="muted" style="direction:ltr;">IMEI: ${esc(m.row.imei1)}</span>
      <span class="pill ${m.row.status==='available'?'green':'gray'}" style="margin-right:6px;">${m.row.status==='available'?'זמין':'נמכר'}</span>
      ${m.row.warrantyUntil? `<div class="muted" style="font-size:11.5px;margin-top:3px;">🛡️ אחריות עד ${new Date(m.row.warrantyUntil).toLocaleDateString('he-IL')} ${new Date(m.row.warrantyUntil)<new Date()?' (פגה)':''}</div>`:''}

function itemizedBreakdown(startDate, endDate){
  const start = new Date(startDate);
  const end = endDate ? new Date(endDate) : new Date();
  const sold = {};
  STATE.sales.filter(s=> new Date(s.date)>=start && new Date(s.date)<=end).forEach(s=>{
    s.items.forEach(it=>{
      if(!sold[it.name]) sold[it.name] = {qty:0, total:0};
      sold[it.name].qty += it.qty;
      sold[it.name].total += round2(it.qty*it.unitPrice - (it.discount||0));
    });
  });
  return Object.entries(sold).map(([name,d])=>({name, qty:d.qty, total:round2(d.total)})).sort((a,b)=>b.total-a.total);
}
function itemizedBreakdownHTML(items){
  if(!items.length) return `<div style="font-size:13px;color:#555;padding:4px 0;">לא נמכרו פריטים בתקופה זו</div>`;
  return `
    <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:800;padding-bottom:4px;border-bottom:1px solid #999;">
      <span>פריט</span><span>כמות / סה"כ</span>
    </div>
    ${items.map(it=>`<div style="display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px solid #ddd;">
      <span>${esc(it.name)}</span><span>${it.qty} × &nbsp;/&nbsp; ${money(it.total)}</span>
    </div>`).join('')}
  `;
}
function shiftCashSalesTotal(shift, untilDate){
  const end = untilDate || new Date();
  const start = new Date(shift.openedAt);
  const salesCash = STATE.sales.filter(s=> new Date(s.date)>=start && new Date(s.date)<=end)
    .reduce((a,s)=> a + s.payments.filter(p=>p.method==='cash').reduce((x,p)=>x+p.amount,0), 0);
  const returnsCash = STATE.returns.filter(r=> new Date(r.date)>=start && new Date(r.date)<=end && r.refundMethod==='cash')
    .reduce((a,r)=>a+r.refundTotal,0);
  return round2(salesCash - returnsCash);
}

function updateShiftDiff(expected){

async function closeShift(expectedCash){
  if(STATE.settings.rolesEnabled && STATE.currentRole!=='manager'){ toast('סגירת משמרת דורשת הרשאת מנהל','err'); return; }
  const counted = Number(document.getElementById('shiftCountedCash').value)||0;
  const shift = STATE.currentShift;
  shift.closedAt = todayISO();
  shift.expectedCash = expectedCash;
  shift.closingCashCounted = counted;
  shift.difference = round2(counted-expectedCash);
  shift.status = 'closed';
  shift.closedBy = STATE.currentRole;
  const salesInShift = STATE.sales.filter(s=> new Date(s.date)>=new Date(shift.openedAt) && new Date(s.date)<=new Date(shift.closedAt));
  shift.totalSales = round2(salesInShift.reduce((a,s)=>a+s.total,0));
  shift.byMethod = {};
  salesInShift.forEach(s=> s.payments.forEach(p=>{ shift.byMethod[p.method] = round2((shift.byMethod[p.method]||0)+p.amount); }));
  shift.itemsSold = itemizedBreakdown(shift.openedAt, shift.closedAt);
  STATE.currentShift = null;
  await persist('shifts');
  const diffNote=shift.difference===0?'ללא הפרש':(shift.difference>0?'עודף בקופה ':'חוסר בקופה ')+money(Math.abs(shift.difference));
  logAudit('סגירת משמרת', `הפרש קופה: ${money(shift.difference)} | ${diffNote}`);
  await persist('auditLog');
  closeModal(); render(); toast('המשמרת נסגרה','ok');
  printZReport(shift);
}

let reportsSubTab = 'pl';
let reportDateFrom = null, reportDateTo = null;
function defaultReportRange(){
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth(), 1);
  return {from: first.toISOString().slice(0,10), to: now.toISOString().slice(0,10)};
}
function setReportRangePreset(preset){
  const now=new Date(), fmt=d=>d.toISOString().slice(0,10);
  let from=new Date(now), to=new Date(now);
  if(preset==='today'){ from=to=new Date(now); }
  else if(preset==='week'){ from=new Date(now); from.setDate(now.getDate()-6); }
  else if(preset==='month'){ from=new Date(now.getFullYear(),now.getMonth(),1); }
  else if(preset==='year'){ from=new Date(now.getFullYear(),0,1); }
  reportDateFrom=fmt(from); reportDateTo=fmt(to); render();
}

    ${statCard('%','שיעור רווחיות', margin+'%', 'var(--purple-500)')}
  </div>
  ${returnsTotal>0?`<div class="card" style="margin-bottom:14px;">
    <div class="muted">סה"כ החזרות בתקופה: <b style="color:var(--red-600);">${money(returnsTotal)}</b></div>
  </div>`:''}

function renderProductsReport(){
  const sales=STATE.sales.filter(s=>inRange(s.date));
  const returns=STATE.returns.filter(r=>inRange(r.date));
  const by={};
  sales.forEach(s=>(s.items||[]).forEach(it=>{
    if(it.isGiftCardSale || it.linkedPreorderId) return;
    const k=it.productId||it.name;
    if(!by[k]) by[k]={name:it.name||'ללא שם',qty:0,revenue:0,cost:0,discount:0};
    const gross=(Number(it.unitPrice)||0)*(Number(it.qty)||0);
    const disc=Number(it.discount)||0;
    by[k].qty+=Number(it.qty)||0;
    by[k].revenue+=gross-disc;
    by[k].discount+=disc;
    const p=getProduct(it.productId); by[k].cost+=(Number(p?.costPrice)||0)*(Number(it.qty)||0);
  }));
  returns.forEach(r=>(r.items||[]).forEach(it=>{
    const k=it.productId||it.name; if(!by[k]) by[k]={name:it.name||'ללא שם',qty:0,revenue:0,cost:0,discount:0};
    by[k].qty-=Number(it.qty)||0;
    by[k].revenue-=Number(it.total)||((Number(it.unitPrice)||0)*(Number(it.qty)||0));
    const p=getProduct(it.productId); by[k].cost-=(Number(p?.costPrice)||0)*(Number(it.qty)||0);
  }));
  const rows=Object.values(by).sort((a,b)=>b.revenue-a.revenue);
  const totalRevenue=rows.reduce((s,r)=>s+r.revenue,0), totalProfit=rows.reduce((s,r)=>s+(r.revenue-r.cost),0);
  return dateRangeControls()+`
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px;">
      ${statCard('📦','מוצרים שנמכרו',rows.reduce((s,r)=>s+r.qty,0),'var(--blue-500)')}
      ${statCard('💵','מחזור לפי מוצרים',money(round2(totalRevenue)),'var(--green-600)')}
      ${statCard('📈','רווח גולמי',money(round2(totalProfit)),'var(--purple-500)')}
    </div>
    <div class="card"><div class="section-title">📦 ביצועי מוצרים</div>
      ${rows.length?'<table class="tbl"><thead><tr><th>מוצר</th><th>כמות נטו</th><th>מחזור נטו</th><th>עלות</th><th>רווח גולמי</th><th>הנחות</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><b>'+esc(r.name)+'</b></td><td>'+r.qty+'</td><td>'+money(round2(r.revenue))+'</td><td>'+money(round2(r.cost))+'</td><td>'+money(round2(r.revenue-r.cost))+'</td><td>'+money(round2(r.discount))+'</td></tr>').join('')+'</tbody></table>':emptyState('📦','אין מכירות מוצרים בטווח התאריכים שנבחר')}

}

function alreadyReturnedQty(saleId, productId, imei){

}
let returnSelections = {};
let currentReturnSaleId = null;
function openReturnModal(saleId){

function renderReturnItemsWrap(sale){
  const wrap = document.getElementById('returnItemsWrap');
  wrap.innerHTML = sale.items.map((it,idx)=>{
    const already = alreadyReturnedQty(sale.id, it.productId, it.imei);
    const maxQty = Math.max(0, it.qty-already);
    return `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--gray-100);">
