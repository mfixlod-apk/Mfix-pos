        ${it.imei?`<div class="muted" style="font-size:11px;direction:ltr;">IMEI: ${esc(it.imei)}</div>`:''}
        <div class="muted" style="font-size:11px;">נמכר: ${it.qty} | כבר הוחזר: ${already} | ניתן להחזרה: ${maxQty}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <input class="input" type="number" min="0" max="${maxQty}" value="0" style="width:70px;" ${maxQty===0?'disabled':''}
          onchange="onReturnQtyChange(${idx}, this.value, ${maxQty})">
        <span style="font-weight:700;min-width:70px;text-align:left;">${money(it.unitPrice)}/יח'</span>
      </div>
    </div>`;
  }).join('');
  updateRefundTotal(sale);
}
function onReturnQtyChange(idx, val, maxQty){
  const qty = Math.max(0, Math.min(Number(val)||0, maxQty));
  returnSelections[idx] = qty;
  updateRefundTotal(findSale(document.querySelector('[onclick^="processReturn"]').getAttribute('onclick').match(/'([^']+)'/)[1]));
}
function updateRefundTotal(sale){
  let total = 0;
  sale.items.forEach((it,idx)=>{
    const qty = returnSelections[idx]||0;
    total += qty*it.unitPrice;
  });
  const el = document.getElementById('refundTotalLabel');
  if(el) el.textContent = money(round2(total));
}
async function processReturn(saleId){
  if(STATE.settings.rolesEnabled && STATE.currentRole!=='manager'){
    toast('החזר/זיכוי דורש אישור מנהל. התחברו כמנהל לפני ביצוע הפעולה.','err'); return;
  }
  const sale = findSale(saleId);
  if(!sale){ toast('מסמך המקור לא נמצא','err'); return; }
  const items = [];
  sale.items.forEach((it,idx)=>{
    const qty = returnSelections[idx]||0;
    if(qty>0) items.push({productId:it.productId, name:it.name, qty, unitPrice:it.unitPrice, imei:it.imei||''});
  });
  if(!items.length){ toast('לא נבחרו פריטים להחזרה','err'); return; }
  // Revalidate against previous returns immediately before mutating stock.
  for(const [idx,it] of sale.items.entries()){
    const requested=Number(returnSelections[idx]||0);
    if(requested<=0) continue;
    const already=returnedQty(sale.id,idx);
    const max=Math.max(0,Number(it.qty||0)-already);
    if(requested>max+0.0001){ toast('הכמות להחזרה עבור "'+it.name+'" השתנתה. ניתן להחזיר עד '+max,'err'); return; }
  }
  const refundTotal = round2(items.reduce((a,it)=>a+it.qty*it.unitPrice,0));
  const refundMethod = document.getElementById('refundMethodSelect').value;
  if(!['cash','credit','giftcard','bank'].includes(refundMethod)){ toast('יש לבחור אמצעי זיכוי תקין','err'); return; }
  const ret = {id:uid('ret'), number: (STATE.returns.length+1), date:todayISO(), originalSaleId:sale.id, items, refundTotal, refundMethod, processedBy:STATE.currentRole};
  // restock with audit history
  for(const it of items){
    const p = getProduct(it.productId);
    if(!p) continue;
    if(p.trackSerial && it.imei){
      const before=productAvailableQty(p);
      const row = p.imeis.find(i=>i.imei1===it.imei);
      if(row){
        row.status='available'; row.soldTo=null; row.soldDate=null; row.saleId=null;
        await addInventoryHistory(p.id,'החזרת יחידה סריאלית',it.qty,before,before+it.qty,'זיכוי ממסמך #'+sale.number+' | IMEI: '+it.imei);
      }
    } else if(!p.isPart){
      const before=Number(p.stock)||0;
      p.stock = before + it.qty;
      await addInventoryHistory(p.id,'החזרת מוצר',it.qty,before,p.stock,'זיכוי ממסמך #'+sale.number);
    }
  }
  // reverse loyalty points earned proportionally (approximate, based on original sale's points-earning rate)
  if(sale.customerId && STATE.settings.loyaltyEnabled && sale.pointsEarned){
    const c = getCustomer(sale.customerId);
    if(c){
      const proportion = sale.total>0 ? refundTotal/sale.total : 0;
      const pointsToReverse = round2(sale.pointsEarned*proportion);
      c.loyaltyPoints = round2(Math.max(0,(c.loyaltyPoints||0) - pointsToReverse));
      await persist('customers');
    }
  }
  STATE.returns.push(ret);
  await persist('returns'); await persist('products');
  logAudit('החזרה/זיכוי', `מסמך מקורי #${sale.number}, סכום זיכוי ${money(refundTotal)} | אמצעי: ${refundMethod}`);
  await persist('auditLog');
  closeModal(); render();
  toast('ההחזרה בוצעה בהצלחה','ok');
  printCreditNote(ret, sale);
}

function renderShiftsReport(){
  const shifts=[...(STATE.shifts||[])].sort((a,b)=>new Date(b.openedAt)-new Date(a.openedAt));
  const closed=shifts.filter(s=>s.status==='closed');
  const expected=closed.reduce((n,s)=>n+(Number(s.expectedCash)||0),0);
  const counted=closed.reduce((n,s)=>n+(Number(s.closingCashCounted)||0),0);
  const variance=closed.reduce((n,s)=>n+(Number(s.difference)||0),0);
  return `
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px;">
      ${statCard('🏦','משמרות סגורות',closed.length,'var(--blue-500)')}
      ${statCard('💵','מזומן צפוי',money(round2(expected)),'var(--purple-500)')}
      ${statCard('🧮','מזומן נספר',money(round2(counted)),'var(--green-600)')}
      ${statCard('⚖️','הפרש מצטבר',money(round2(variance)),'var(--red-600)')}
    </div>
    <div class="card">
      <div class="section-title">🏦 היסטוריית משמרות</div>
      ${shifts.length?`<table class="tbl"><thead><tr><th>פתיחה</th><th>סגירה</th><th>סטטוס</th><th>קופה פתיחה</th><th>צפוי</th><th>נספר</th><th>הפרש</th></tr></thead><tbody>
      ${shifts.map(s=>`<tr><td>${fmtDate(s.openedAt)}</td><td>${s.closedAt?fmtDate(s.closedAt):'—'}</td><td><span class="pill ${s.status==='closed'?'green':'blue'}">${s.status==='closed'?'סגורה':'פתוחה'}</span></td><td>${money(Number(s.openingCash)||0)}</td><td>${s.status==='closed'?money(Number(s.expectedCash)||0):'—'}</td><td>${s.status==='closed'?money(Number(s.closingCashCounted)||0):'—'}</td><td>${s.status==='closed'?money(Number(s.difference)||0):'—'}</td></tr>`).join('')}
      </tbody></table>`:emptyState('🏦','אין היסטוריית משמרות עדיין')}
    </div>`;
}
let auditRoleFilter='all', auditActionFilter='';
function renderAuditLog(){
  const q=(auditActionFilter||'').trim().toLowerCase();
  const list=(STATE.auditLog||[]).filter(l=>{
    if(auditRoleFilter!=='all' && l.role!==auditRoleFilter) return false;
    if(q && !String(l.action||'').toLowerCase().includes(q) && !String(l.details||'').toLowerCase().includes(q)) return false;
    return true;
  }).slice(0,200);
  return `
  <div class="card" style="margin-bottom:14px;">
    <div class="section-title">📜 יומן פעולות</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <select class="input" style="max-width:170px;" onchange="auditRoleFilter=this.value;renderReports();">
        <option value="all" ${auditRoleFilter==='all'?'selected':''}>כל התפקידים</option>
        <option value="manager" ${auditRoleFilter==='manager'?'selected':''}>מנהל</option>
        <option value="cashier" ${auditRoleFilter==='cashier'?'selected':''}>קופאי</option>
      </select>
      <input class="input" style="max-width:320px;" value="${esc(auditActionFilter)}" placeholder="חיפוש פעולה או פרטים..." oninput="auditActionFilter=this.value;renderReports();">
      <span class="pill">${list.length} רשומות מוצגות</span>
    </div>
  </div>
  <div class="card">
    ${list.length? `<table class="tbl"><thead><tr><th>תאריך</th><th>תפקיד</th><th>פעולה</th><th>פרטים</th></tr></thead><tbody>
      ${list.map(l=>`<tr><td>${fmtDate(l.ts)}</td><td><span class="pill ${l.role==='manager'?'blue':'gray'}">${l.role==='manager'?'מנהל':'קופאי'}</span></td><td><b>${esc(l.action)}</b></td><td class="muted">${esc(l.details)}</td></tr>`).join('')}
    </tbody></table>`: emptyState('📜','אין רשומות התואמות לסינון')}
  </div>`;
}

/* ===================== DASHBOARD ===================== */
function renderDashboard(){
  const today = new Date(); today.setHours(0,0,0,0);
  const salesToday = STATE.sales.filter(s=> new Date(s.date) >= today);
  const revenueToday = salesToday.reduce((a,s)=>a+s.total,0);
  const cashToday = salesToday.reduce((a,s)=> a + s.payments.filter(p=>p.method==='cash').reduce((x,p)=>x+p.amount,0), 0);
  const openRepairs = STATE.repairs.filter(r=>r.status!=='נמסר');
  const lowStockItems = STATE.products.filter(p=> !p.trackSerial && (p.stock||0) <= (STATE.settings.lowStockThreshold||2));
  const totalCustomers = STATE.customers.length;
  const availablePhones = STATE.products.filter(p=>p.trackSerial).reduce((a,p)=> a + p.imeis.filter(i=>i.status==='available').length, 0);

  const recentSales = [...STATE.sales].sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,6);

  return `
  <div class="grid4" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;">
    ${statCard('💰','מכירות היום', money(revenueToday), 'var(--blue-500)')}
    ${statCard('💵','מזומן בקופה (היום)', money(cashToday), 'var(--green-600)')}
    ${statCard('🔧','תיקונים פתוחים', openRepairs.length, 'var(--amber-500)')}
    ${statCard('📱','מכשירים זמינים במלאי', availablePhones, 'var(--purple-500)')}
  </div>
  <div class="grid2" style="align-items:start;">
    <div class="card">
      <div class="section-title">🧾 מכירות אחרונות</div>
      ${recentSales.length? `<table class="tbl"><thead><tr><th>מס' מסמך</th><th>לקוח</th><th>סכום</th><th>תאריך</th></tr></thead><tbody>
        ${recentSales.map(s=>`<tr><td>#${s.number}</td><td>${esc(customerName(s.customerId))}</td><td>${money(s.total)}</td><td>${fmtDate(s.date)}</td></tr>`).join('')}
      </tbody></table>` : emptyState('🧾','אין מכירות עדיין')}
    </div>
    <div class="card">
      <div class="section-title">⚠️ התראות מלאי נמוך</div>
      ${lowStockItems.length? `<table class="tbl"><thead><tr><th>מוצר</th><th>קטגוריה</th><th>במלאי</th></tr></thead><tbody>
        ${lowStockItems.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td><span class="pill red">${p.stock}</span></td></tr>`).join('')}
      </tbody></table>` : emptyState('✅','המלאי במצב תקין')}
    </div>
  </div>
  <div class="card" style="margin-top:14px;">
    <div class="section-title">👥 סטטיסטיקת לקוחות</div>
    <div class="muted">סה"כ ${totalCustomers} לקוחות רשומים במועדון הלקוחות.</div>
  </div>
  `;
}
function statCard(icon,label,value,color){
  return `<div class="card" style="border-right:4px solid ${color};">
    <div style="font-size:22px;">${icon}</div>
    <div style="font-size:22px;font-weight:800;margin-top:6px;">${value}</div>
    <div class="muted" style="font-size:12.5px;font-weight:600;">${label}</div>
  </div>`;
}
function emptyState(icon,text){
  return `<div class="empty-state"><div class="ic">${icon}</div><div>${text}</div></div>`;
}
function customerName(id){
  if(!id) return 'לקוח מזדמן';
  const c = getCustomer(id);
  return c ? c.name : 'לקוח מזדמן';
}

/* ===================== APP SHELL / ROUTER ===================== */
const TABS = [
  {id:'dashboard', label:'סקירה', ic:'🏠'},
  {id:'pos', label:'קופה', ic:'🧾'},
  {id:'inventory', label:'מלאי', ic:'📦'},
  {id:'repairs', label:'תיקונים', ic:'🔧'},
  {id:'customers', label:'לקוחות', ic:'👥'},
  {id:'reports', label:'דוחות', ic:'📊'},
  {id:'settings', label:'הגדרות', ic:'⚙️'}
];
const RESTRICTED_FOR_CASHIER = ['reports','settings'];
function tabAllowed(id){
  if(!STATE.settings || !STATE.settings.rolesEnabled) return true;
  if(STATE.currentRole==='manager') return true;
  return !RESTRICTED_FOR_CASHIER.includes(id);
}
function visibleTabs(){ return TABS.filter(t=>tabAllowed(t.id)); }
function requireManager(action){
  if(canManage()) return true;
  openModal('<div class="modal-head"><h3>🔒 אישור מנהל</h3><button class="modal-close" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="muted">הפעולה "'+esc(action||'פעולה מוגנת')+'" דורשת קוד מנהל.</div><div class="field" style="margin-top:14px;"><label class="flabel">PIN מנהל</label><input class="input" id="managerOverridePin" type="password" inputmode="numeric" autofocus></div><div id="managerOverrideError" style="color:var(--red-600);font-size:12px;"></div></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">ביטול</button><button class="btn btn-primary" onclick="confirmManagerOverride('+JSON.stringify(action||'פעולה מוגנת')+')">אישור</button></div>');
  return false;
}
function confirmManagerOverride(action){
  const pin=(document.getElementById('managerOverridePin').value||'').trim();
  if(STATE.settings.managerPin && pin===STATE.settings.managerPin){
    logAction('אישור מנהל',action); persist('auditLog'); closeModal(); toast('אישור מנהל התקבל','ok');
    return true;
  }
  document.getElementById('managerOverrideError').textContent='קוד מנהל שגוי'; return false;
}
function canManage(){ return !STATE.settings.rolesEnabled || STATE.currentRole==='manager'; }

function appShell(){
  return `
  <div class="sidebar">
    <div class="brand">📱</div>
    <div class="navtabs">
      ${visibleTabs().map(t=>`
        <button class="navtab ${STATE.activeTab===t.id?'active':''}" onclick="switchTab('${t.id}')">
          <span class="ic">${t.ic}</span><span>${t.label}</span>
        </button>`).join('')}
    </div>
    <div class="clock" id="sidebarClock"></div>
  </div>
  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="topTitle"></h1>
        <div class="sub" id="topSub"></div>
      </div>
      <div class="topbar-right" id="topRight"></div>
    </div>
    ${TABS.map(t=>`<div class="view ${STATE.activeTab===t.id?'active':''}" id="view-${t.id}"></div>`).join('')}
  </div>`;
}

function switchTab(id){
  if(!tabAllowed(id)){ toast('אין הרשאה לגשת ללשונית זו במצב קופאי','err'); return; }
  STATE.activeTab = id;
  render();
}

function updateClock(){
  const el = document.getElementById('sidebarClock');
  if(el){
    const d = new Date();
    el.innerHTML = d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}) + '<br>' + d.toLocaleDateString('he-IL');
  }
}

const TAB_META = {
  dashboard:{title:'סקירה כללית', sub:'מצב החנות היום'},
  pos:{title:'קופה רושמת', sub:'מכירה חדשה'},
  inventory:{title:'ניהול מלאי', sub:'מוצרים, סריאלים ו-IMEI'},
  repairs:{title:'תיקונים', sub:'קבלת מכשירים וניהול טיפולים'},
  customers:{title:'לקוחות ומועדון', sub:'CRM וניהול לקוחות'},
  reports:{title:'דוחות וניתוח', sub:'רווחיות, החזרות, משמרות ויומן פעולות'},
  settings:{title:'הגדרות מערכת', sub:'התאמה אישית מלאה'}
};

function render(){
  const app = document.getElementById('app');
  if(!app.querySelector('.sidebar')){ app.innerHTML = appShell(); }
  else{
    // just toggle nav active + views
    document.querySelectorAll('.navtab').forEach((b,i)=> b.classList.toggle('active', visibleTabs()[i] && visibleTabs()[i].id===STATE.activeTab));
    document.querySelectorAll('.view').forEach(v=> v.classList.toggle('active', v.id === 'view-'+STATE.activeTab));
  }
  document.getElementById('topTitle').textContent = TAB_META[STATE.activeTab].title;
  document.getElementById('topSub').textContent = TAB_META[STATE.activeTab].sub;
  renderTopRight();
  const target = document.getElementById('view-'+STATE.activeTab);
  if(STATE.activeTab==='dashboard') target.innerHTML = renderDashboard();
  if(STATE.activeTab==='pos') target.innerHTML = renderPOS();
  if(STATE.activeTab==='inventory') target.innerHTML = renderInventory();
  if(STATE.activeTab==='repairs') target.innerHTML = renderRepairs();
  if(STATE.activeTab==='customers') target.innerHTML = renderCustomers();
  if(STATE.activeTab==='reports') target.innerHTML = renderReports();
  if(STATE.activeTab==='settings') target.innerHTML = renderSettings();
  afterRenderHooks();
}

function renderTopRight(){
  const lowStock = STATE.products.filter(p=> !p.trackSerial && !p.isPart && (p.stock||0) <= (STATE.settings.lowStockThreshold||2)).length +
                    STATE.products.filter(p=> p.isPart && (p.stock||0) <= (STATE.settings.lowStockThreshold||2)).length;
  const openRepairs = STATE.repairs.filter(r=> r.status!=='נמסר').length;
  const overdueRepairs = STATE.repairs.filter(r=> r.dueDate && r.status!=='נמסר' && new Date(r.dueDate) < new Date(new Date().toDateString())).length;
  document.getElementById('topRight').innerHTML = `
    <button class="badge" style="border:none;cursor:pointer;background:var(--navy-900);color:#fff;" onclick="openGlobalSearchModal()">🔍 חיפוש כללי</button>
    ${overdueRepairs>0?`<span class="badge" style="background:var(--red-100);color:var(--red-600);" title="תיקונים באיחור">⏰ ${overdueRepairs} תיקונים באיחור</span>`:''}
    ${lowStock>0?`<span class="badge amber" title="מוצרים במלאי נמוך">⚠️ ${lowStock} במלאי נמוך</span>`:''}
    ${openRepairs>0?`<span class="badge blue" title="תיקונים פתוחים">🔧 ${openRepairs} תיקונים פתוחים</span>`:''}
    ${STATE.currentShift? `<button class="badge green" style="border:none;cursor:pointer;" onclick="openShiftModal()">🟢 משמרת פתוחה</button>` : `<button class="badge amber" style="border:none;cursor:pointer;" onclick="openShiftModal()">⚪ אין משמרת פתוחה</button>`}
    ${STATE.settings.rolesEnabled? `<button class="badge blue" style="border:none;cursor:pointer;" onclick="openRoleLoginModal()">👤 ${STATE.currentRole==='manager'?'מנהל':'קופאי'}</button>`:''}
    <span class="badge green">${esc(STATE.settings.businessName)}</span>
  `;
}

function afterRenderHooks(){
  if(STATE.activeTab==='pos') bindPOSEvents();
  if(STATE.activeTab==='settings'){ renderPrinterProfilesWrap(); renderPaymentMethodsWrap(); renderPromoWrap('promoWrap'); renderRepairTemplatesWrap(); renderRepairDisclaimersWrap(); }
  if(STATE.activeTab==='inventory') renderInvTable();
  if(STATE.activeTab==='customers') renderCustTable();
  if(STATE.activeTab==='reports') afterReportsRender();
}

async function init(){
  const app=document.getElementById('app');
  app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;width:100vw;font-size:15px;color:#6b7686;">טוען נתונים…</div>`;
  try{
    await loadAll();
    render();
    setInterval(updateClock, 1000*30);
    updateClock();
    if(STATE.settings.rolesEnabled && STATE.settings.managerPin){
      openRoleLoginModal(true);
    }
  }catch(err){
    console.error('[MFIX INIT]',err);
    const message=String(err&&err.message||err||'Unknown error');
    app.innerHTML=`<div style="height:100vh;padding:28px;display:flex;align-items:center;justify-content:center;background:#f5f7fa;font-family:Arial,sans-serif;direction:rtl;"><div style="max-width:520px;background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.12);text-align:center;"><h2 style="margin-top:0;color:#dc2626;">MFIX POS לא נטען</h2><p>אירעה שגיאת הפעלה. פרטי השגיאה:</p><pre style="white-space:pre-wrap;text-align:left;direction:ltr;background:#111827;color:#fff;padding:12px;border-radius:8px;font-size:12px;">${esc(message)}</pre><button onclick="location.reload()" style="padding:10px 18px;border:0;border-radius:8px;background:#2158cf;color:white;font-size:15px;">נסה שוב</button></div></div>`;
    try{ if(window.AndroidPrinter&&AndroidPrinter.reportAppError) AndroidPrinter.reportAppError(message); }catch(_){}
  }
}
window.addEventListener('error',e=>console.error('[MFIX WINDOW ERROR]',e.message,e.filename,e.lineno));
window.addEventListener('unhandledrejection',e=>console.error('[MFIX PROMISE ERROR]',e.reason));
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
